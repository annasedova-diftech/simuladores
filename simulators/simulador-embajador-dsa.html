:root{
  --brand:#f0531c;
  --brand-press:#d84512;
  --violet:#2e1bff;
  --ink:#0b0d12;
  --ink-2:#8a8f9a;
  --ink-3:#b4b9c4;
  --bg:#f4f5f8;
  --card:#ffffff;
  --line:#e8e9ee;
  --green:#12b76a;
  --green-soft:#e6f7ee;
  --violet-soft:#eceafe;
  --blue-soft:#e7f0ff;
  --red:#e5342f;
  --red-soft:#ffeceb;
  --r:18px;
  --font:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--font);
  background:#e9eaef;color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit}

/* ===== Layout ===== */
.topbar{
  height:56px;background:#fff;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:14px;padding:0 20px;position:sticky;top:0;z-index:50;
}
.topbar .logo{width:26px;height:26px;border-radius:7px;background:var(--brand);display:grid;place-items:center;color:#fff;font-weight:800;font-size:12px}
.topbar h1{font-size:15px;margin:0;font-weight:700}
.topbar .sp{flex:1}
.tbtn{
  height:34px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:#fff;
  font-size:13px;font-weight:600;cursor:pointer;color:var(--ink);
}
.tbtn:hover{background:#f6f7f9}
.tbtn.on{background:var(--violet-soft);border-color:#c9c2ff;color:var(--violet)}

.stage{
  display:flex;gap:28px;align-items:flex-start;justify-content:center;
  padding:26px 20px 60px;max-width:1180px;margin:0 auto;flex-wrap:wrap;
}

/* ===== Phone ===== */
.phone{
  width:392px;flex:0 0 392px;height:812px;border-radius:42px;background:#0d1526;
  padding:11px;box-shadow:0 24px 60px rgba(15,23,42,.28);position:sticky;top:82px;
}
.viewport{
  width:100%;height:100%;border-radius:32px;overflow:hidden;background:var(--bg);
  display:flex;flex-direction:column;position:relative;
}
.statusbar{
  height:34px;flex:0 0 34px;display:flex;align-items:center;justify-content:space-between;
  padding:0 22px;font-size:13px;font-weight:700;color:var(--ink);background:transparent;
}
.statusbar.dark{color:#fff}
.statusbar .icons{letter-spacing:2px;font-size:11px}
.screen{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;padding:0 20px 20px}
.screen::-webkit-scrollbar{width:0}
.screen.dark{background:#0b0f17;color:#fff}
.screen.plain{background:#fff}
.navbar{
  height:58px;flex:0 0 58px;background:#fff;border-top:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-around;
}
.navbar .nav{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--ink-3);cursor:default}
.navbar .nav.act{color:var(--brand)}
.navbar .nav .ic{font-size:19px}
.navbar .nav .ic{display:grid;place-items:center;height:20px}

/* ===== Common UI ===== */
.h1{font-size:38px;line-height:1;font-weight:800;letter-spacing:-.055em;margin:26px 0 10px}
.h2{font-size:26px;line-height:1.1;font-weight:800;letter-spacing:-.045em;margin:20px 0 6px}

const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function toast(msg, ok){ st.toast={msg,ok}; render(); clearTimeout(window.__t); window.__t=setTimeout(()=>{st.toast=null;render();},2600); }
function logit(t){ st.log.push(t); }

function go(id){ st.screen=id; st.sheet=null; st.modal=null; window.scrollTo(0,0); render(); const s=$('screen'); if(s) s.scrollTop=0; }
function startFlow(list){ st.flow=list.slice(); st.fi=0; go(st.flow[0]); }
function next(){
  let i = st.fi;
  do { i++; } while (st.flow[i] && SKIP[st.flow[i]] && SKIP[st.flow[i]]());
  if(!st.flow[i]) return;
  st.fi = i; go(st.flow[i]);
}
function back(){
  let i = st.fi;
  do { i--; } while (st.flow[i] && SKIP[st.flow[i]] && SKIP[st.flow[i]]());
  if(i<0) return;
  st.fi=i; go(st.flow[i]);
}
const ans = k => st.ans[k];
const setAns = (k,v)=>{ st.ans[k]=v; render(); };
function toggleMulti(k,v){
  const cur = st.ans[k] || [];
  st.ans[k] = cur.includes(v) ? cur.filter(x=>x!==v) : cur.concat([v]);
  render();
}

/* ---- Validación de email realista ---- */
function validarEmail(v){
  const s = (v||'').trim();
  if(!s) return 'Ingresa tu correo electrónico.';
  if(/\s/.test(s)) return 'El correo no puede contener espacios.';
  if(!s.includes('@')) return 'Falta el símbolo @ en el correo.';
  if((s.match(/@/g)||[]).length>1) return 'El correo solo puede tener un símbolo @.';
  const [local,dom] = s.split('@');
  if(!local) return 'Falta el nombre antes del @.';
  if(local.length>64) return 'El nombre antes del @ es demasiado largo.';
  if(!/^[A-Za-z0-9._%+-]+$/.test(local)) return 'El nombre antes del @ tiene caracteres no permitidos.';
  if(/^\.|\.$|\.\./.test(local)) return 'El nombre antes del @ no puede empezar, terminar ni repetir puntos.';
  if(!dom) return 'Falta el dominio después del @.';
  if(!dom.includes('.')) return 'El dominio debe incluir un punto, por ejemplo plata.mx';
  if(/^[.-]|[.-]$|\.\./.test(dom)) return 'El dominio no es válido.';
  if(!/^[A-Za-z0-9.-]+$/.test(dom)) return 'El dominio tiene caracteres no permitidos.';
  const tld = dom.split('.').pop();
  if(!/^[A-Za-z]{2,}$/.test(tld)) return 'La terminación del dominio no es válida (ej. .com, .mx).';
  if(dom.split('.').some(p=>!p)) return 'El dominio no es válido.';
  return '';
}

/* ---- Bloques reutilizables ---- */
function head(o){
  o = o||{};
  const b = o.back ? '<button class="iconbtn" data-a="back">←</button>' : '<span style="width:34px"></span>';
  const x = o.close ? '<button class="iconbtn x" data-a="closeMeeting">✕</button>' : '';
  const p = o.prog ? '<div class="prog"><i style="width:'+progPct()+'%"></i></div>' : '<div style="flex:1"></div>';
  return '<div class="headrow">'+b+p+x+'</div>';
}
function tipoChip(){
  if(!st.tipo || !st.flow.length) return '';
  return '<div style="position:absolute;right:20px;top:6px;z-index:6;background:'+(st.tipo==='pm'?'#eceafe':'#ffe9df')+';color:'+(st.tipo==='pm'?'var(--violet)':'#c2410c')+';border-radius:99px;font-size:10px;font-weight:800;letter-spacing:.05em;padding:4px 9px">'+(st.tipo==='pm'?'PM':'PFAE')+'</div>';
}
function progPct(){ return st.flow.length ? Math.round((st.fi+1)/st.flow.length*100) : 0; }
function btn(label,action,disabled,cls){
  return '<button class="btn '+(cls||'')+'" data-a="'+action+'"'+(disabled?' disabled':'')+'>'+esc(label)+'</button>';
}
function optGroup(key,list,multi){
  const cur = st.ans[key];
  return '<div class="optgroup">'+list.map(o=>{
    const v = typeof o==='string'?o:o.v, l = typeof o==='string'?o:o.l;
    const sel = multi ? (cur||[]).includes(v) : cur===v;
    return '<div class="opt'+(sel?' sel':'')+'" data-a="'+(multi?'multi':'pick')+'" data-k="'+esc(key)+'" data-v="'+esc(v)+'">'
      +'<span class="lbl">'+esc(l)+'</span><span class="dot'+(multi?' sq':'')+'"></span></div>';
  }).join('')+'</div>';
}
function qScreen(title,key,list,multi,sub){
  return {
    head:{back:true,close:true,prog:true},
    body:()=> '<div class="h2">'+esc(title)+'</div>'+(sub?'<p class="sub">'+esc(sub)+'</p>':'')+optGroup(key,list,multi),
    footer:()=> btn('Continuar','next', multi ? !(st.ans[key]||[]).length : !st.ans[key])
  };
}
function camScreen(o){
  return {
    dark:true,
    custom:()=> '<div class="cam">'
      + '<div class="camtop"><h4>'+esc(o.title)+'</h4><p>'+esc(o.note||'')+'</p></div>'
      + '<div class="frame"><div class="doc '+(o.shape||'')+'">'+esc(o.inner||'')+'</div></div>'
      + (o.thumbs? '<div class="thumbs">'+Array.from({length:st.shots}).map((_,i)=>'<div>pág. '+(i+1)+'</div>').join('')+'</div>':'')
      + '<div class="camnote">'+esc(o.hint||'')+'</div>'
      + '<div class="shutter"><button data-a="'+(o.shutter||'next')+'"></button></div>'
      + (o.corner? '<button class="shotbtn" data-a="next"'+(st.shots<2?' disabled style="opacity:.45"':'')+'>Tomar foto</button>':'')
      + '</div>'
  };
}

function render(){
  const def = S[st.screen] || S['home'];
  const scr = $('screen');
  scr.className = 'screen' + (def.dark?' dark':'') + (def.plain?' plain':'');
  $('statusbar').className = 'statusbar' + (def.dark?' dark':'');
  $('statusbar').style.background = def.dark ? '#0b0f17' : (def.plain?'#fff':'');
  let inner;
  if(def.custom) inner = def.custom();
  else inner = '<div class="pane">' + (def.head?head(def.head):'') + '<div>'+def.body()+'</div>'
       + '<div class="spacer"></div>' + '<div class="pad-b">'+(def.footer?def.footer():'')+'</div></div>';
  scr.innerHTML = inner;

  const nb = $('navbar');
  if(def.nav){ nb.style.display='flex'; nb.innerHTML =
    '<div class="nav act"><span class="ic">'+ICO.home+'</span>Inicio</div>'
    + '<div class="nav" style="position:relative"><span class="ic">'+ICO.map+'</span>Mapa'
    + '<span style="position:absolute;top:-2px;right:2px;background:#e5342f;color:#fff;font-size:8px;font-weight:800;border-radius:99px;padding:1px 5px">new</span></div>'; }
  else nb.style.display='none';

  $('overlay').innerHTML = tipoChip() + (st.toast?'<div class="toast'+(st.toast.ok?' ok':'')+'">'+esc(st.toast.msg)+'</div>':'')
    + (st.sheet?sheetHTML():'') + (st.modal?modalHTML():'');

  renderGuide();
  if(def.onRender) def.onRender();
  if(st._focus){ const el=document.querySelector('[data-in="'+st._focus+'"]'); if(el){ el.focus(); try{el.setSelectionRange(el.value.length,el.value.length);}catch(e){} } }
}

  const g = G[st.screen] || G_DEFAULT;

      +'<div class="muted" style="margin-top:8px">Paso '+(st.fi+1)+' de '+st.flow.length+' · '+(st.tipo==='pm'?'Persona Moral':'PFAE')+'</div>':'')

/* ---- firma ---- */
function initSig(){
  const c = document.getElementById('sig'); if(!c) return;
  const r = c.parentElement.getBoundingClientRect();
  c.width = r.width; c.height = r.height;
  let ctx=null; try{ ctx=c.getContext('2d'); }catch(e){}
  if(!ctx){ return; }
  ctx.lineWidth=2.4; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#101418';
  st.strokes = st.strokes || [];
  const redraw=()=>{ ctx.clearRect(0,0,c.width,c.height);
    st.strokes.forEach(str=>{ ctx.beginPath(); str.forEach((pt,i)=> i?ctx.lineTo(pt[0],pt[1]):ctx.moveTo(pt[0],pt[1])); ctx.stroke(); }); };
  window.__sigRedraw = redraw; redraw();
  let drawing=false, cur=null;
  const pos=e=>{const b=c.getBoundingClientRect();const p=e.touches?e.touches[0]:e;return [p.clientX-b.left,p.clientY-b.top];};
  const down=e=>{drawing=true;cur=[pos(e)];st.strokes.push(cur);e.preventDefault();};
  const move=e=>{if(!drawing)return;cur.push(pos(e));redraw();e.preventDefault();};
  const up=()=>{if(!drawing)return;drawing=false;if(cur&&cur.length<2)st.strokes.pop();
    const has=st.strokes.length>0; if(has!==st.signed){st.signed=has;render();}};
  c.addEventListener('mousedown',down);c.addEventListener('mousemove',move);window.addEventListener('mouseup',up);
  c.addEventListener('touchstart',down);c.addEventListener('touchmove',move);c.addEventListener('touchend',up);
}

function go(id){
  st.screen = id; st.sheet=null; st.modal=null;
  const d = S[id]; if(d && d.onEnter) d.onEnter();
  render();
  const s=$('screen'); if(s) s.scrollTop=0;
  clearTimeout(window.__auto);
  if(d && d.auto) window.__auto = setTimeout(()=>next(), d.auto);
}
function jumpTo(id){ const i=st.flow.indexOf(id); if(i>=0) st.fi=i; go(id); }

document.addEventListener('click', e=>{
  const stop = e.target.closest('[data-stop]');
  const t = e.target.closest('[data-a]');
  if(!t) return;
  if(t.hasAttribute('disabled')) return;
  if(stop && t.dataset.a==='closeSheet' && stop.contains(e.target) && t===stop.parentElement) return;
  const a = t.dataset.a, v = t.dataset.v, k = t.dataset.k;
  if(a==='pick'||a==='multi'){ A[a](k,v); return; }
  if(A[a]) A[a](v);
});
document.addEventListener('input', e=>{
  const el = e.target.closest('[data-in]'); if(!el) return;
  const k = el.dataset.in, v = el.value;
  st._focus = k;
  if(k==='email'){ st.email=v; if(st.emailErr){st.emailErr='';render();} return; }
  if(k==='pass'){ st.pass=v; if(st.passErr){st.passErr='';render();} return; }
  if(k==='paisQ'){ st.paisQ=v; render(); return; }
  if(k==='manualCode'){ st.manualCode=v; if(st.manualErr){st.manualErr='';render();} return; }
  if(k==='coment'){ st.ans.coment=v; return; }
  if(k==='cName'||k==='fName'){ st.tmpName=v; return; }
  if(k==='cRel'){ st.tmpRel=v; return; }
  if(k==='cPhone'||k==='fPhone'){ st.tmpPhone=v; return; }
});
document.addEventListener('change', e=>{
  const el = e.target.closest('[data-in]'); if(!el) return;
  if(el.dataset.in==='cRel') st.tmpRel = el.value;
});
document.addEventListener('keydown', e=>{
  if(e.key!=='Enter') return;
  if(st.screen==='login-email') A.submitEmail();
  else if(st.screen==='login-pass') A.submitPass();
});
document.addEventListener('focusin', e=>{ const el=e.target.closest('[data-in]'); if(el) st._focus=el.dataset.in; });
document.addEventListener('focusout', ()=>{ st._focus=null; });

$('btnRestart').addEventListener('click', ()=>A.restart());
$('tglGuide').addEventListener('click', e=>{
  const g=$('guide'); g.classList.toggle('hidden');
  e.target.classList.toggle('on', !g.classList.contains('hidden'));
});

go('login-email');
</script>

.viewport{position:relative}
.screen{padding-top:0;display:flex;flex-direction:column}
.pane{display:flex;flex-direction:column;flex:1;min-height:100%}
.pane>*{flex-shrink:0}
.spacer{flex:1 0 auto}
select.field{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#9ca3af 50%),linear-gradient(135deg,#9ca3af 50%,transparent 50%);background-position:calc(100% - 20px) 26px,calc(100% - 14px) 26px;background-size:6px 6px,6px 6px;background-repeat:no-repeat}
</style>
