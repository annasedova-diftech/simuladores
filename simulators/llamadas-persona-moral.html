<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Llamadas a Persona Moral · Cuenta Empresa</title>
<meta name="sim:category" content="PyME">
<meta name="sim:description" content="Curso para agentes CPA: Día 1 y Día 2 con certificación">
<style>
  :root{
    --naranja:#FF4F12;      /* acento de marca: ajústalo al naranja exacto de Plata */
    --naranja-suave:#FFF1EC;
    --tinta:#141414;
    --gris:#6B6B6B;
    --linea:#E7E5E3;
    --fondo:#F5F4F2;
    --blanco:#FFFFFF;
    --verde:#0F9D58;
    --verde-suave:#E9F7EF;
    --rojo:#D7342A;
    --rojo-suave:#FDECEA;
    --azul-suave:#EEF3FF;
    --radio:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Arial,sans-serif;
    color:var(--tinta);background:var(--fondo);
    -webkit-font-smoothing:antialiased;
  }
  button{font:inherit;cursor:pointer}

  /* ---------- barra superior ---------- */
  .barra{
    position:sticky;top:0;z-index:40;background:var(--blanco);
    border-bottom:1px solid var(--linea);
  }
  .barra-in{
    max-width:1100px;margin:0 auto;padding:12px 24px;
    display:flex;align-items:center;gap:16px;
  }
  .marca{font-weight:800;letter-spacing:.06em;color:var(--naranja);font-size:14px}
  .barra-titulo{
    font-size:14px;color:var(--gris);border-left:1px solid var(--linea);
    padding-left:16px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .btn-indice{
    border:1px solid var(--linea);background:var(--blanco);border-radius:999px;
    padding:8px 16px;font-size:14px;font-weight:600;
  }
  .btn-indice:hover{border-color:var(--tinta)}
  .btn-inicio{
    display:inline-flex;align-items:center;gap:6px;border:1px solid var(--linea);background:var(--blanco);
    border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;color:var(--tinta);
  }
  .btn-inicio:hover{border-color:var(--tinta)}
  .btn-inicio svg{width:16px;height:16px;flex:none}
  .saludo{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:-4px 0 18px;font-size:15px}
  .btn-mini{
    border:1px solid var(--linea);background:var(--blanco);border-radius:999px;
    padding:4px 12px;font-size:12px;font-weight:600;color:var(--gris);
  }
  .btn-mini:hover{border-color:var(--tinta);color:var(--tinta)}
  .progreso{height:3px;background:var(--linea)}
  .progreso span{display:block;height:3px;background:var(--naranja);width:0;transition:width .3s}

  /* ---------- lienzo ---------- */
  .lienzo{max-width:1100px;margin:0 auto;padding:40px 24px 120px}
  h1{font-size:40px;line-height:1.1;margin:0 0 12px;letter-spacing:-.02em}
  h2{font-size:28px;line-height:1.2;margin:0 0 20px;letter-spacing:-.01em}
  h3{font-size:17px;margin:0 0 6px}
  p{margin:0 0 14px}
  .tenue{color:var(--gris)}

  .tarjeta{
    background:var(--blanco);border:1px solid var(--linea);border-radius:var(--radio);
    padding:20px 22px;margin:0 0 16px;
  }

  /* ---------- gancho del personaje ---------- */
  .gancho{display:flex;gap:14px;align-items:flex-start}
  .avatar{
    width:34px;height:34px;border-radius:50%;background:var(--naranja);color:#fff;
    display:flex;align-items:center;justify-content:center;font-weight:700;flex:none;
  }
  .gancho-quien{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--naranja);font-weight:700}
  .gancho-txt{font-weight:600;margin:2px 0 10px}
  .revelar{
    border:1px solid var(--linea);background:var(--blanco);border-radius:999px;
    padding:6px 14px;font-size:13px;font-weight:600;
  }
  .respuesta{
    margin-top:10px;background:var(--verde-suave);border-radius:10px;padding:12px 14px;
    font-size:15px;display:none;
  }
  .respuesta.ver{display:block}

  /* ---------- bloques ---------- */
  .cita{border-left:3px solid var(--naranja);padding:4px 0 4px 16px;margin:0 0 16px}
  .cita b{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--naranja)}
  .cita span{font-size:18px;font-weight:600}

  .guion{background:var(--naranja-suave);border-radius:10px;padding:12px 16px;margin:0 0 16px}
  .guion b{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--naranja);margin-bottom:2px}
  .guion span{font-size:16px;font-weight:500}

  .aviso{border-radius:var(--radio);padding:16px 18px;margin:0 0 16px;border:1px solid transparent}
  .aviso.info{background:var(--azul-suave);border-color:#D7E2FF}
  .aviso.alerta{background:var(--rojo-suave);border-color:#F6CFCB}
  .aviso.ok{background:var(--verde-suave);border-color:#CFEBDA}

  .rejilla{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));margin:0 0 16px}

  .enlace{display:block;text-decoration:none;color:inherit}
  .enlace:hover{border-color:var(--naranja)}
  .enlace h3{color:var(--naranja)}
  .enlace h3::after{content:" ↗";font-weight:400}

  table{width:100%;border-collapse:collapse;background:var(--blanco);
        border:1px solid var(--linea);border-radius:var(--radio);overflow:hidden;margin:0 0 16px}
  th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--linea);vertical-align:top;font-size:15px}
  th{background:#FAF9F8;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--gris)}
  tr:last-child td{border-bottom:none}
  .tabla-scroll{overflow-x:auto;margin:0 0 16px}
  .tabla-scroll table{margin:0}

  ul.lista{margin:0 0 16px;padding-left:20px}
  ul.lista li{margin-bottom:8px}

  .paso{display:flex;gap:14px;margin-bottom:12px}
  .paso-n{
    width:28px;height:28px;border-radius:50%;background:var(--naranja-suave);color:var(--naranja);
    font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;font-size:14px;
  }

  /* ---------- preguntas ---------- */
  .reto{background:var(--blanco);border:2px solid var(--naranja);border-radius:var(--radio);padding:20px 22px;margin:24px 0 0}
  .reto-et{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--naranja);font-weight:700;margin-bottom:8px}
  .reto h3{font-size:19px;margin-bottom:4px}
  .opciones{margin:14px 0 0;display:flex;flex-direction:column;gap:8px}
  .opcion{
    display:flex;gap:12px;align-items:flex-start;border:1px solid var(--linea);
    border-radius:10px;padding:12px 14px;background:var(--blanco);text-align:left;width:100%;
  }
  .opcion:hover{border-color:var(--tinta)}
  .opcion .marca{
    width:18px;height:18px;border:2px solid #C9C6C3;flex:none;margin-top:2px;
  }
  .opcion[data-tipo="unica"] .marca{border-radius:50%}
  .opcion[data-tipo="multiple"] .marca{border-radius:5px}
  .opcion.sel{border-color:var(--naranja)}
  .opcion.sel .marca{border-color:var(--naranja);background:var(--naranja);box-shadow:inset 0 0 0 3px #fff}
  .opcion.bien{border-color:var(--verde);background:var(--verde-suave)}
  .opcion.mal{border-color:var(--rojo);background:var(--rojo-suave)}
  .opcion[disabled]{cursor:default;opacity:1;color:var(--tinta);-webkit-text-fill-color:var(--tinta)}
  .veredicto{margin-top:12px;border-radius:10px;padding:12px 14px;font-size:15px}
  .veredicto.bien{background:var(--verde-suave)}
  .veredicto.mal{background:var(--rojo-suave)}
  .veredicto b{display:block;margin-bottom:2px}

  /* ---------- pie ---------- */
  .pie{
    position:fixed;left:0;right:0;bottom:0;background:var(--blanco);
    border-top:1px solid var(--linea);z-index:30;
  }
  .pie-in{max-width:1100px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:12px}
  .pie-et{flex:1;font-size:13px;color:var(--gris)}
  .btn{
    border:1px solid var(--linea);background:var(--blanco);border-radius:999px;
    padding:11px 22px;font-weight:600;
  }
  .btn:hover{border-color:var(--tinta)}
  .btn.primario{background:var(--naranja);border-color:var(--naranja);color:#fff}
  .btn.primario:hover{filter:brightness(.94)}
  .btn[disabled]{opacity:.4;cursor:default;filter:none}

  /* ---------- índice ---------- */
  .velo{position:fixed;inset:0;background:rgba(20,20,20,.3);z-index:50;display:none}
  .velo.ver{display:block}
  .indice{
    position:fixed;top:0;right:0;bottom:0;width:340px;max-width:90vw;background:var(--blanco);
    z-index:60;transform:translateX(100%);transition:transform .25s;overflow-y:auto;padding:20px;
  }
  .indice.ver{transform:none}
  .indice h3{font-size:18px;margin-bottom:16px}
  .idx-item{display:flex;gap:12px;align-items:center;padding:10px 8px;border-radius:10px;width:100%;
            border:none;background:none;text-align:left}
  .idx-item:hover{background:var(--fondo)}
  .idx-item[disabled]{opacity:.4;cursor:default}
  .idx-n{width:24px;height:24px;border-radius:50%;background:var(--fondo);color:var(--gris);
         font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
  .idx-item.actual .idx-n{background:var(--naranja);color:#fff}
  .idx-item.hecho .idx-n{background:var(--verde);color:#fff}
  .idx-sub{padding:6px 8px 6px 44px;font-size:14px;color:var(--gris);line-height:1.35}
  .idx-sub.actual{color:var(--naranja);font-weight:600}

  /* ---------- «Lo esencial del módulo»: lista con casillas ---------- */
  .esencial{display:flex;flex-direction:column;gap:10px;margin:0 0 16px}
  .esencial-item{
    display:flex;gap:14px;align-items:flex-start;background:var(--blanco);border:1px solid var(--linea);
    border-radius:var(--radio);padding:16px 18px;cursor:pointer;margin:0;
  }
  .esencial-item:hover{border-color:var(--tinta)}
  .esencial-item input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--naranja);flex:none;cursor:pointer}
  .esencial-item.marcado{border-color:#CFEBDA;background:var(--verde-suave)}
  .esencial-item b{display:block;margin-bottom:2px}
  .esencial-item .tenue{font-size:15px}

  /* ---------- esquemas (HTML/CSS) ---------- */
  .esq{background:#F0F3FA;border-radius:20px;padding:24px;margin:0 0 20px;color:#1B1F2B}
  .esq-titulo{font-size:20px;font-weight:700;margin:0 0 18px;letter-spacing:-.01em}
  .pildora{
    display:inline-flex;align-items:center;border-radius:999px;padding:4px 12px;
    font-size:12px;font-weight:600;line-height:1.3;white-space:nowrap;
  }
  .pildora.cliente{background:#FF4F12;color:#fff}
  .pildora.banco{background:#1B1F2B;color:#fff}
  .pildora.plazo{background:#F0F3FA;color:#1B1F2B}
  .esq-flecha{display:flex;justify-content:center;padding:2px 0;color:#B8BEC9}
  .esq-flecha svg{width:18px;height:22px}
  .esq-nota{font-size:13px;color:#6B7080;margin:16px 0 0}

  /* pasos uno bajo otro */
  .esq-v .esq-paso{
    background:#fff;border-radius:20px;padding:20px 22px;display:grid;
    grid-template-columns:36px minmax(180px,250px) 1fr;gap:16px 18px;align-items:start;
  }
  .esq-n{
    flex:none;width:36px;height:36px;border-radius:50%;color:#fff;font-weight:700;font-size:15px;
    display:flex;align-items:center;justify-content:center;
  }
  .esq-n.cliente{background:#FF4F12} .esq-n.banco{background:#1B1F2B}
  .esq-paso h4{margin:0 0 8px;font-size:17px;line-height:1.25}
  .esq-pildoras{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
  .esq-texto{color:#5B6070;font-size:15px;line-height:1.5}

  /* flujo horizontal */
  .esq-h{display:flex;gap:10px;align-items:stretch}
  .esq-tu{background:#FFEDE4;border-radius:20px;padding:18px;flex:none;width:190px;display:flex;flex-direction:column;gap:12px}
  .esq-et{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:#FF4F12}
  .esq-card{border-radius:20px;padding:18px 16px;display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
  .esq-card.naranja{background:#FF4F12;color:#fff}
  .esq-card.clara{background:#F0F3FA}
  .esq-ico{width:28px;height:28px;margin-bottom:4px;flex:none}
  .esq-paso-et{font-size:12px;font-weight:600;opacity:.75}
  .esq-card h4{margin:0;font-size:15px;line-height:1.3}
  .esq-card p{margin:0;font-size:13px;line-height:1.45;color:#5B6070}
  .esq-card.naranja p{color:rgba(255,255,255,.85)}
  .esq-despues{background:#fff;border-radius:20px;padding:18px;flex:1;min-width:0;display:flex;flex-direction:column}
  .esq-sub{margin:0 0 14px;font-size:15px;font-weight:700}
  .esq-fila{display:flex;gap:8px;align-items:stretch;flex:1}
  .esq-flecha-h{display:flex;align-items:center;justify-content:center;color:#B8BEC9;flex:none}
  .esq-flecha-h svg{width:18px;height:18px}
  @media (max-width:1000px){
    .esq-h{flex-direction:column}
    .esq-tu{width:auto}
    .esq-h > .esq-flecha-h svg{transform:rotate(90deg)}
  }
  @media (max-width:700px){
    .esq{padding:18px}
    .esq-v .esq-paso{grid-template-columns:36px 1fr;padding:18px}
    .esq-v .esq-texto{grid-column:2}
    .esq-fila{flex-direction:column}
    .esq-flecha-h svg{transform:rotate(90deg)}
  }


  /* ---------- imágenes y lightbox ---------- */
  .figura{margin:0 0 20px}
  .figura img{display:block;max-width:100%;height:auto;border-radius:12px;border:1px solid var(--linea);background:var(--blanco);cursor:zoom-in}
  .figura figcaption{font-size:13px;color:var(--gris);margin-top:8px}
  .lightbox{position:fixed;inset:0;z-index:100;background:rgba(20,20,20,.88);display:none;align-items:center;justify-content:center;padding:24px;cursor:zoom-out}
  .lightbox.ver{display:flex}
  .lightbox img{max-width:100%;max-height:100%;border-radius:8px;background:#fff;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .lightbox-cerrar{position:absolute;top:16px;right:16px;width:40px;height:40px;border-radius:50%;border:none;background:rgba(255,255,255,.15);color:#fff;font-size:22px;line-height:40px;text-align:center;padding:0}
  .lightbox-cerrar:hover{background:rgba(255,255,255,.3)}
  .lightbox-pie{position:absolute;left:24px;right:24px;bottom:16px;text-align:center;color:rgba(255,255,255,.8);font-size:14px;pointer-events:none}
  .modulo-portada .modulo-img{flex:none;width:200px}
  .modulo-portada .modulo-img img{display:block;width:100%;height:auto;border-radius:16px}

  /* comunes de los esquemas nuevos */
  .esq-sub2{font-size:15px;color:#5B6070;margin:-10px 0 18px}
  .esq-sub2 .pildora{margin:0 4px}
  .pildora svg{width:14px;height:14px;margin-right:5px;flex:none}
  .pildora.aplica{background:#FFEDE4;color:#FF4F12;font-size:11px;padding:2px 8px}
  .pildora.gris{background:#E9ECF3;color:#1B1F2B}
  .esq-card.blanca{background:#fff}
  .esq-card.borde{background:#fff;box-shadow:inset 0 0 0 2px #FF4F12}
  .esq-ul{margin:0;padding:0;list-style:none}
  .esq-ul li{position:relative;padding-left:16px;margin:0 0 6px;font-size:14px;line-height:1.45}
  .esq-ul li::before{content:"";position:absolute;left:0;top:8px;width:7px;height:7px;border-radius:50%;background:#FF4F12}
  .esq-flecha-h .pildora,.esq-flecha .pildora{margin-left:6px}

  /* carriles (Tú → El cliente → El banco y el embajador) */
  .esq-carriles{display:flex;flex-direction:column;gap:4px}
  .esq-carril{display:grid;grid-template-columns:150px repeat(var(--cols,6),1fr);gap:0 10px;align-items:center;border-radius:20px;padding:16px 18px;min-height:110px}
  .esq-carril.clara{background:#fff}
  .esq-carril.naranja{background:#FFEDE4}
  .esq-carril-nombre{font-weight:700;font-size:17px;line-height:1.25;padding-right:10px}
  .esq-carril-paso{text-align:center;display:flex;flex-direction:column;align-items:stretch}
  .esq-carril-card{border-radius:14px;padding:12px 10px;border:1px solid #E1E5EE;background:#fff;font-size:13px;line-height:1.4;color:#5B6070;min-height:84px;display:flex;flex-direction:column;justify-content:center}
  .esq-carril-card b{display:block;color:#1B1F2B;font-size:14px;line-height:1.3;margin-bottom:2px}
  .esq-carril-card.destacado{background:#FF4F12;border-color:#FF4F12;color:#fff}
  .esq-carril-card.destacado b{color:#fff;font-size:17px;margin:0}
  .esq-carril-nota{font-size:12px;color:#5B6070;line-height:1.35;margin-top:6px}
  .esq-carril-flecha{display:grid;grid-template-columns:150px repeat(var(--cols,6),1fr);gap:0 10px;height:30px}
  .esq-carril-flecha > div{display:flex;align-items:center;color:#B8BEC9;font-size:12px;gap:6px;padding-left:24px}
  .esq-carril-flecha svg{width:16px;height:20px;flex:none}
  .esq-carril-flecha span{color:#5B6070;max-width:260px;line-height:1.25}
  .esq-carril-paso .esq-flecha-h{display:none}
  @media (max-width:900px){
    .esq-carril,.esq-carril-flecha{grid-template-columns:1fr}
    .esq-carril-flecha{height:auto;padding:4px 0 4px 18px}
    .esq-carril-flecha > div{padding-left:0;grid-column:1 !important}
    .esq-carril-nombre{margin-bottom:10px}
    .esq-carril-paso{grid-column:1 !important;text-align:left}
    .esq-carril-paso .esq-flecha-h{display:flex;justify-content:flex-start;padding:4px 0 4px 16px}
    .esq-carril-paso .esq-flecha-h svg{transform:rotate(90deg)}
    .esq-carril-card{min-height:0}
  }

  /* flujo vertical con ramas (la llamada de un vistazo) */
  .esq-flujo{display:grid;grid-template-columns:minmax(0,440px) minmax(0,1fr);gap:0 28px;align-items:center}
  .esq-nodo{background:#fff;border-radius:16px;padding:14px 20px;text-align:center;font-size:15px;line-height:1.4;color:#1B1F2B}
  .esq-nodo b{color:#1B1F2B}
  .esq-nodo.destacado{background:#FF4F12;color:#fff}
  .esq-nodo.destacado b{color:#fff}
  .esq-rombo{position:relative;padding:34px 44px;text-align:center;font-weight:700;font-size:15px;line-height:1.3;color:#1B1F2B}
  .esq-rombo::before{content:"";position:absolute;inset:0;background:#FFEDE4;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);z-index:0}
  .esq-rombo span{position:relative;z-index:1;display:block}
  .esq-flujo-vacio{min-height:1px}
  .esq-flujo-flecha{display:flex;align-items:center;gap:6px;justify-content:center;padding:2px 0;color:#B8BEC9;font-size:13px}
  .esq-flujo-flecha svg{width:18px;height:22px}
  .esq-flujo-flecha span{color:#5B6070}
  .esq-rama{display:flex;align-items:center;gap:8px}
  .esq-rama .esq-flecha-h{flex-direction:column;gap:2px;font-size:12px;color:#5B6070;min-width:46px}
  .esq-rama .esq-flecha-h svg{width:24px;height:18px}
  .esq-rama-card{background:#E9ECF3;border-radius:16px;padding:14px 18px;font-size:14px;line-height:1.4;flex:1}
  @media (max-width:700px){
    .esq-flujo{grid-template-columns:1fr;gap:0}
    .esq-flujo-vacio{display:none}
    .esq-rama{padding:6px 0 6px 24px}
    .esq-rama .esq-flecha-h svg{transform:none}
    .esq-rombo{padding:30px 28px;font-size:14px}
    .esq-nodo{font-size:14px;padding:12px 14px}
  }

  /* Característica → Puente → Beneficio */
  .esq-cpb{display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:0 20px;align-items:end}
  .esq-cpb-card{background:#fff;border-radius:16px;padding:22px 16px 26px;text-align:center}
  .esq-cpb-card.borde{box-shadow:inset 0 0 0 2px #FF4F12}
  .esq-cpb-card.borde h4{color:#FF4F12}
  .esq-cpb-card h4{margin:0;font-size:24px;letter-spacing:-.01em}

</head>

var ordenCert = {};       // preguntaId -> opciones barajadas del intento en curso

// ---------------------------------------------------------------- utilidades
function el(sel){ return document.querySelector(sel); }
function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}
function barajar(a){
  var r = a.slice();
  for (var k = r.length - 1; k > 0; k--){
    var j = Math.floor(Math.random() * (k + 1));
    var t = r[k]; r[k] = r[j]; r[j] = t;
  }
  return r;
}

// ---------------------------------------------------------------- identidad
/** «Juan  PÉREZ» y «juan perez» caen en la misma clave. */
function clave_(nombre, apellido){
  return (String(nombre || '') + ' ' + String(apellido || ''))
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
}
function tituloCase_(s){
  return String(s || '').trim().replace(/\s+/g, ' ')
    .replace(/(^|\s|-)([\p{L}])/gu, function(m, pre, letra){ return pre + letra.toUpperCase(); });
}

// ---------------------------------------------------------------- progreso local
function claveProgreso(clave){
  return LS_PROGRESO + (dia === 2 ? 'dia2:' : '') + clave;
}
function leerProgreso(clave){
  var p = null;
  try { p = JSON.parse(localStorage.getItem(claveProgreso(clave)) || 'null'); } catch(e){}
  p = p || {};
  return {
    pasoActual: Number(p.pasoActual) || 0,
    modulosHechos: Array.isArray(p.modulosHechos) ? p.modulosHechos.slice() : [],
    estado: p.estado || 'en progreso',
    creado: p.creado || null,
    fechaTermino: p.fechaTermino || null,
    cert: (p.cert && Array.isArray(p.cert.intentos)) ? { intentos: p.cert.intentos.slice() } : { intentos: [] }
  };
}
function guardarProgreso(clave, cambios){
  var p = leerProgreso(clave);
  Object.keys(cambios).forEach(function(k){ p[k] = cambios[k]; });
  p.ultimoAcceso = new Date().toISOString();
  try { localStorage.setItem(claveProgreso(clave), JSON.stringify(p)); } catch(e){}
  return p;
}

// ---------------------------------------------------------------- envío al formulario
/**
 * Envía un payload al formulario como campos entry.*: token, accion, nombre, apellido y
 * datos (JSON con el resto del payload). Si no hay URL, no hace nada. Una reintentada a los 3 s.
 */
function enviar(payload){
  if (!FORM_ACTION_URL) return;
  var nombre = payload.nombre || (agente ? agente.nombre : '');
  var apellido = payload.apellido || (agente ? agente.apellido : '');
  var datos = {};
  Object.keys(payload).forEach(function(k){
    if (k === 'token' || k === 'accion' || k === 'nombre' || k === 'apellido') return;
    datos[k] = payload[k];
  });
  var params = new URLSearchParams();
  params.append(ENTRADAS.token, TOKEN);
  params.append(ENTRADAS.accion, payload.accion || '');
  params.append(ENTRADAS.nombre, nombre);
  params.append(ENTRADAS.apellido, apellido);
  params.append(ENTRADAS.datos, JSON.stringify(datos));

  function intento(n){
    var reintentar = function(){ if (n < 1) setTimeout(function(){ intento(n + 1); }, 3000); };
    try {
      fetch(FORM_ACTION_URL, {
        method: 'POST',
        mode: 'no-cors',
        body: params,
        keepalive: true
      }).catch(reintentar);
    } catch(e){ reintentar(); }
  }
  intento(0);
}

// ---------------------------------------------------------------- estructura
function construirPasos(){
  pasos = [{ tipo:'identidad' }];
  curso.modulos.forEach(function(m, mi){
    pasos.push({ tipo:'modulo', modulo:m, n:mi + 1 });
    m.pantallas.forEach(function(p){
      pasos.push({ tipo:'pantalla', modulo:m, pantalla:p, n:mi + 1 });
    });
    if (m.quiz) pasos.push({ tipo:'quiz', modulo:m, n:mi + 1 });
  });
  if (dia === 2 && CERT) pasos.push({ tipo:'cert' });
  else pasos.push({ tipo:'resultado' });
}

/** Último paso al que se vuelve al retomar: la certificación sí, la pantalla final del Día 1 no. */
function ultimoPasoRetomable(){
  return pasos[pasos.length - 1].tipo === 'cert' ? pasos.length - 1 : pasos.length - 2;
}

function nombreDia(){ return dia === 2 ? 'Día 2' : 'Día 1'; }

function elegirDia(n){
  if (!DIAS[n]) return;
  dia = n; curso = DIAS[n];
  construirPasos();
  revisiones = {}; respuestasQuiz = {}; maxVisto = 0;
  certFase = 'intro'; respuestasCert = {}; ordenCert = {};
  var g = identidadGuardada();
  if (g) pintarBienvenida(g);
  else { i = 0; pintar(); }
}

/** Registro: identidad + progreso guardado en este navegador, y aviso al receptor. */
function identificar(nombre, apellido, luego){
  var a;
  try {
    nombre = tituloCase_(nombre);
    apellido = tituloCase_(apellido);
    if (!nombre || !apellido) throw new Error('Falta el nombre o el apellido.');
    var clave = clave_(nombre, apellido);
    var prog = leerProgreso(clave);
    if (!prog.creado) prog = guardarProgreso(clave, { creado: new Date().toISOString() });
    else guardarProgreso(clave, {});
    a = { clave: clave, nombre: nombre, apellido: apellido,
          pasoActual: prog.pasoActual, estado: prog.estado,
          modulosHechos: prog.modulosHechos };
  } catch(err){
    var e = el('#errorIdent');
    if (e){ e.textContent = err.message || 'No se pudo guardar. Intenta de nuevo.'; e.classList.add('ver'); }
    var c = el('#cargandoIdent'); if (c) c.classList.remove('ver');
    return;
  }
  agente = a;
  maxVisto = Math.max(maxVisto, a.pasoActual || 0);
  try {
    localStorage.setItem(LS, JSON.stringify({ clave:a.clave, nombre:a.nombre, apellido:a.apellido }));
  } catch(e){}
  enviar({ accion:'registrar', nombre:a.nombre, apellido:a.apellido });
  if (luego) luego();
}

/** Avance: pasoActual = max(anterior, paso). */
function guardarPaso(paso){
  if (!agente) return;
  var prog = leerProgreso(agente.clave);
  if (paso > prog.pasoActual) guardarProgreso(agente.clave, { pasoActual: paso });
  else guardarProgreso(agente.clave, {});
  agente.pasoActual = Math.max(prog.pasoActual, paso);
  enviar({ accion:'paso', paso: paso });
}

// ---------------------------------------------------------------- pintado
function pintar(){
  var p = pasos[i];
  maxVisto = Math.max(maxVisto, i);
  window.scrollTo(0,0);

  if (p.tipo === 'identidad')      pintarIdentidad();
  else if (p.tipo === 'modulo')    pintarModulo(p);
  else if (p.tipo === 'pantalla')  pintarPantalla(p);
  else if (p.tipo === 'quiz')      pintarQuiz(p);
  else if (p.tipo === 'cert')      pintarCert();
  else                             pintarResultado();

  actualizarCromo(p);
  if (agente && i > 0) guardarPaso(i);
}

function actualizarCromo(p){
  var pct = Math.round(i * 100 / (pasos.length - 1));
  el('#barraProgreso').style.width = pct + '%';
  el('#barraTitulo').textContent = curso.titulo;
  el('#btnIndice').style.display = (p.tipo === 'identidad') ? 'none' : '';
  el('#btnInicioBarra').style.display = '';
  var sinPie = p.tipo === 'identidad' || p.tipo === 'resultado' ||
               (p.tipo === 'cert' && certFase === 'resultado');
  el('#pie').style.display = sinPie ? 'none' : '';
  var etiqueta = p.modulo ? ('Módulo ' + p.n + ' · ' + p.modulo.titulo) : '';
  if (p.tipo === 'cert'){
    etiqueta = (certFase === 'preguntas')
      ? ('Respondidas ' + contarCert() + ' de ' + CERT.preguntas.length)
      : CERT.titulo;
  }
  el('#pieEtiqueta').textContent = etiqueta;
  el('#btnAtras').disabled = (i <= 1) || (p.tipo === 'cert' && certFase === 'preguntas');
}

    '</div>' + (p.modulo.imagen
      ? '<div class="modulo-img"><img src="' + esc(p.modulo.imagen) + '" alt="" loading="lazy"></div>'
      : '<div class="modulo-n">' + p.n + '</div>') + '</div>';
  el('#btnSiguiente').disabled = false;
  el('#btnSiguiente').textContent = 'Comenzar';
}

/** Retos de una pantalla: `retos` (varios) o `reto` (uno). */
function retosDe(pantalla){
  if (Array.isArray(pantalla.retos)) return pantalla.retos;
  return pantalla.reto ? [pantalla.reto] : [];
}

function pintarPantalla(p){
  var h = '<h2>' + esc(p.pantalla.titulo) + '</h2>';

  if (p.pantalla.gancho){
    var g = p.pantalla.gancho;
    h += '<div class="tarjeta"><div class="gancho">' +
      '<div class="avatar">' + esc(g.persona.charAt(0)) + '</div><div>' +
      '<div class="gancho-quien">' + esc(g.persona) + ' · ' + esc(g.rol) + '</div>' +
      '<div class="gancho-txt">' + esc(g.pregunta) + '</div>' +
      '<button class="revelar" id="btnRevelar">Ver explicación</button>' +
      '<div class="respuesta" id="respGancho">' + esc(g.respuesta) + '</div>' +
      '</div></div></div>';
  }

  var esencial = esEsencial(p.pantalla);
  (p.pantalla.bloques || []).forEach(function(b, bi){
    h += esencial ? pintarBloqueEsencial(b, bi) : pintarBloque(b);
  });

  var retos = retosDe(p.pantalla);
  retos.forEach(function(r, idx){ h += pintarReto(r, idx, retos.length); });

  el('#lienzo').innerHTML = h;

  if (esencial) conectarEsencial(p);

  if (p.pantalla.gancho){
    el('#btnRevelar').onclick = function(){
      el('#respGancho').classList.add('ver');
      this.style.display = 'none';
    };
  }

  el('#btnSiguiente').textContent = 'Siguiente';
  if (retos.length){
    el('#btnSiguiente').disabled = true;
    conectarRetos(retos, p.modulo.id);
  } else {
    el('#btnSiguiente').disabled = false;
  }
}

function pintarBloque(b){
  if (b.t === 'parrafo') return '<p>' + esc(b.texto) + '</p>';

  if (b.t === 'cita')
    return '<div class="cita"><b>' + esc(b.quien) + '</b><span>' + esc(b.texto) + '</span></div>';

  if (b.t === 'guion')
    return '<div class="guion"><b>Guion</b><span>' + esc(b.texto) + '</span></div>';

  if (b.t === 'aviso')
    return '<div class="aviso ' + esc(b.tono || 'info') + '">' + esc(b.texto) + '</div>';

  if (b.t === 'tarjetas'){
    var s = '<div class="rejilla">';
    b.items.forEach(function(it){
      s += '<div class="tarjeta"><h3>' + esc(it.titulo) + '</h3>' +
           '<div class="tenue">' + esc(it.texto) + '</div></div>';
    });
    return s + '</div>';
  }

  if (b.t === 'enlaces'){
    var en = '<div class="rejilla">';
    b.items.forEach(function(it){
      en += '<a class="tarjeta enlace" href="' + esc(it.url) + '" target="_blank" rel="noopener">' +
            '<h3>' + esc(it.titulo) + '</h3>' +
            '<div class="tenue">' + esc(it.texto) + '</div></a>';
    });
    return en + '</div>';
  }

  if (b.t === 'tabla'){
    var t = '<div class="tabla-scroll"><table><thead><tr>';
    b.encabezados.forEach(function(c){ t += '<th>' + esc(c) + '</th>'; });
    t += '</tr></thead><tbody>';
    b.filas.forEach(function(f){
      t += '<tr>';
      f.forEach(function(c, idx){
        t += '<td>' + (idx === 0 ? '<b>' + esc(c) + '</b>' : esc(c)) + '</td>';
      });
      t += '</tr>';
    });
    return t + '</tbody></table></div>';
  }

  if (b.t === 'lista'){
    var l = '<ul class="lista">';
    b.items.forEach(function(it){ l += '<li>' + esc(it) + '</li>'; });
    return l + '</ul>';
  }

  if (b.t === 'pasos'){
    // items como {titulo, texto} (Día 1) o como ['titulo', 'texto'] (Día 2)
    var ps = '<div class="tarjeta">';
    b.items.forEach(function(it, idx){
      var titulo = Array.isArray(it) ? it[0] : it.titulo;
      var texto = Array.isArray(it) ? it[1] : it.texto;
      ps += '<div class="paso"><div class="paso-n">' + (idx + 1) + '</div><div>' +
            '<h3>' + esc(titulo) + '</h3>' +
            '<div class="tenue">' + esc(texto) + '</div></div></div>';
    });
    return ps + '</div>';
  }

  if (b.t === 'imagen')
    return '<figure class="figura"><img src="' + esc(b.src) + '" alt="' + esc(b.alt || '') + '" loading="lazy"' +
           ' style="max-width:100%;height:auto;border-radius:12px;border:1px solid var(--linea)"' +
           (b.ancho ? ' width="' + esc(b.ancho) + '"' : '') + '>' +
           (b.pie ? '<figcaption>' + esc(b.pie) + '</figcaption>' : '') + '</figure>';

  if (b.t === 'esquema') return pintarEsquema(b);

  return '';
}

// ---------------------------------------------------------------- «Lo esencial del módulo»
/** Pantalla de cierre del módulo: sus tarjetas y listas se pintan como lista con casillas. */
function esEsencial(pantalla){
  return /^\s*lo esencial/i.test(String(pantalla.titulo || ''));
}

/** Identificador estable de la pantalla: día, módulo y posición dentro del módulo. */
function idPantalla(p){
  var k = p.modulo.pantallas.indexOf(p.pantalla);
  return 'd' + dia + '-' + p.modulo.id + '-p' + (k + 1);
}

function claveEsencial(p){
  return 'pm-curso:esencial:' + (agente ? agente.clave : 'anonimo') + ':' + idPantalla(p);
}

/** Solo las tarjetas y las listas cambian de forma; el resto de bloques se pinta igual. */
function pintarBloqueEsencial(b, bi){
  if (b.t !== 'tarjetas' && b.t !== 'lista') return pintarBloque(b);
  var s = '<div class="esencial" data-bloque="' + bi + '">';
  b.items.forEach(function(it, k){
    var id = 'esencial-' + bi + '-' + k;
    s += '<label class="esencial-item" for="' + id + '">' +
         '<input type="checkbox" id="' + id + '" data-bloque="' + bi + '" data-item="' + k + '">' +
         '<div>' + (b.t === 'tarjetas'
            ? '<b>' + esc(it.titulo) + '</b><div class="tenue">' + esc(it.texto) + '</div>'
            : '<div>' + esc(it) + '</div>') +
         '</div></label>';
  });
  return s + '</div>';
}

/** Las casillas se guardan solo en este navegador: no se envían a ningún lado. */
function conectarEsencial(p){
  var clave = claveEsencial(p);
  var marcadas = [];
  try { marcadas = JSON.parse(localStorage.getItem(clave) || '[]'); } catch(e){}
  if (!Array.isArray(marcadas)) marcadas = [];
  var cajas = document.querySelectorAll('.esencial-item input');
  Array.prototype.forEach.call(cajas, function(c){
    var id = c.getAttribute('data-bloque') + ':' + c.getAttribute('data-item');
    c.checked = marcadas.indexOf(id) !== -1;
    c.parentNode.classList.toggle('marcado', c.checked);
    c.onchange = function(){
      var k = marcadas.indexOf(id);
      if (c.checked && k === -1) marcadas.push(id);
      if (!c.checked && k !== -1) marcadas.splice(k, 1);
      c.parentNode.classList.toggle('marcado', c.checked);
      try { localStorage.setItem(clave, JSON.stringify(marcadas)); } catch(e){}
    };
  });
}

// ---------------------------------------------------------------- lightbox de imágenes
/** Clic en una imagen del contenido: se abre a pantalla completa; se cierra con clic o Escape. */
function abrirLightbox(img){
  var lb = el('#lightbox');
  el('#lightboxImg').src = img.src;
  el('#lightboxImg').alt = img.alt || '';
  var fig = img.closest ? img.closest('figure') : null;
  var pie = fig ? fig.querySelector('figcaption') : null;
  el('#lightboxPie').textContent = pie ? pie.textContent : '';
  lb.classList.add('ver');
}
function cerrarLightbox(){
  el('#lightbox').classList.remove('ver');
  el('#lightboxImg').src = '';
}
document.addEventListener('click', function(ev){
  var t = ev.target;
  if (t && t.tagName === 'IMG' && t.parentNode && t.parentNode.classList && t.parentNode.classList.contains('figura')){
    abrirLightbox(t); return;
  }
  if (t && (t.id === 'lightbox' || t.id === 'lightboxCerrar' || t.id === 'lightboxImg')) cerrarLightbox();
});
document.addEventListener('keydown', function(ev){
  if (ev.key === 'Escape' && el('#lightbox').classList.contains('ver')) cerrarLightbox();
});

};
function icono(nombre, clase){
  var svg = ICONOS[nombre] || '';
  return clase ? svg.replace('<svg ', '<svg class="' + clase + '" ') : svg;
}

/**
 * { t:'esquema', tipo:'pasos-vertical', titulo, nota, pasos:[{quien:'cliente'|'banco', actor, titulo, plazo, texto}] }
 * { t:'esquema', tipo:'flujo-horizontal', tuParte:{etiqueta, paso, titulo, icono}, titulo, pasos:[{paso, titulo, icono, texto}] }
 * Tipos nuevos (datos en el bloque; ver cada rama): 'carriles', 'flujo-ramas', 'cpb', 'bloques-numerados', 'proceso-qa', 'columnas-atributos'
 */
function pintarEsquema(b){
  if (b.tipo === 'pasos-vertical'){
    var v = '<div class="esq esq-v">' +
            (b.titulo ? '<div class="esq-titulo">' + esc(b.titulo) + '</div>' : '');
    (b.pasos || []).forEach(function(s, k){
      var quien = s.quien === 'banco' ? 'banco' : 'cliente';
      if (k > 0) v += '<div class="esq-flecha">' + icono('flecha-abajo') + '</div>';
      v += '<div class="esq-paso">' +
           '<div class="esq-n ' + quien + '">' + (s.n != null ? esc(s.n) : (k + 1)) + '</div>' +
           '<div><h4>' + esc(s.titulo) + '</h4><div class="esq-pildoras">' +
           '<span class="pildora ' + quien + '">' + esc(s.actor || (quien === 'banco' ? 'Banco' : 'Cliente')) + '</span>' +
           (s.plazo ? '<span class="pildora plazo">' + esc(s.plazo) + '</span>' : '') +
           '</div></div>' +
           '<div class="esq-texto">' + esc(s.texto || '') + '</div>' +
           '</div>';
    });
    if (b.nota) v += '<p class="esq-nota">' + esc(b.nota) + '</p>';
    return v + '</div>';
  }

  if (b.tipo === 'flujo-horizontal'){
    var tu = b.tuParte || {};
    var f = '<div class="esq"><div class="esq-h">' +
            '<div class="esq-tu"><div class="esq-et">' + esc(tu.etiqueta || 'Tu parte') + '</div>' +
            '<div class="esq-card naranja">' + icono(tu.icono || 'telefono', 'esq-ico') +
            (tu.paso ? '<div class="esq-paso-et">' + esc(tu.paso) + '</div>' : '') +
            '<h4>' + esc(tu.titulo || '') + '</h4>' +
            (tu.texto ? '<p>' + esc(tu.texto) + '</p>' : '') +
            '</div></div>' +
            '<div class="esq-flecha-h">' + icono('flecha-derecha') + '</div>' +
            '<div class="esq-despues">' +
            (b.titulo ? '<div class="esq-sub">' + esc(b.titulo) + '</div>' : '') +
            '<div class="esq-fila">';
    (b.pasos || []).forEach(function(s, k){
      if (k > 0) f += '<div class="esq-flecha-h">' + icono('flecha-derecha') + '</div>';
      f += '<div class="esq-card clara">' + icono(s.icono, 'esq-ico') +
           (s.paso ? '<div class="esq-paso-et">' + esc(s.paso) + '</div>' : '') +
           '<h4>' + esc(s.titulo) + '</h4>' +
           (s.texto ? '<p>' + esc(s.texto) + '</p>' : '') +
           '</div>';
    });
    return f + '</div></div></div></div>';
  }


  if (b.tipo === 'carriles'){
    // { carriles:[{nombre, tono:'naranja'|'clara', pasos:[{n, titulo, texto, nota, destacado}]}] }
    // Cada paso ocupa la siguiente columna libre: los carriles se leen como una escalera.
    var carriles = b.carriles || [];
    var totalPasos = carriles.reduce(function(a, c){ return a + (c.pasos || []).length; }, 0);
    var c = '<div class="esq"><div class="esq-carriles" style="--cols:' + totalPasos + '">';
    var col = 0;
    carriles.forEach(function(car, k){
      if (k > 0){
        c += '<div class="esq-carril-flecha" style="--cols:' + totalPasos + '">' +
             '<div style="grid-column:' + (col + 2) + '">' + icono('flecha-abajo') +
             (car.entrada ? '<span>' + esc(car.entrada) + '</span>' : '') + '</div></div>';
      }
      c += '<div class="esq-carril ' + (car.tono === 'naranja' ? 'naranja' : 'clara') + '">' +
           '<div class="esq-carril-nombre">' + esc(car.nombre) + '</div>';
      (car.pasos || []).forEach(function(s, j){
        col++;
        c += '<div class="esq-carril-paso" style="grid-column:' + (col + 1) + '">' +
             (j > 0 ? '<div class="esq-flecha-h">' + icono('flecha-derecha') + '</div>' : '') +
             '<div class="esq-carril-card' + (s.destacado ? ' destacado' : '') + '">' +
             '<b>' + (s.n != null ? esc(s.n) + ' · ' : '') + esc(s.titulo) + '</b>' +
             (s.texto ? esc(s.texto) : '') + '</div>' +
             (s.nota ? '<div class="esq-carril-nota">' + esc(s.nota) + '</div>' : '') +
             '</div>';
      });
      c += '</div>';
    });
    return c + '</div>' + (b.nota ? '<p class="esq-nota">' + esc(b.nota) + '</p>' : '') + '</div>';
  }

  if (b.tipo === 'flujo-ramas'){
    // { nodos:[ {tipo:'paso', n, titulo, texto, destacado} | {tipo:'decision', pregunta, sigue, rama:{etiqueta, titulo, texto}} ] }
    var fl = '<div class="esq"><div class="esq-flujo">';
    (b.nodos || []).forEach(function(n, k){
      if (k > 0){
        var ant = b.nodos[k - 1];
        fl += '<div class="esq-flujo-flecha">' + icono('flecha-abajo') +
              (ant.tipo === 'decision' && ant.sigue ? '<span>' + esc(ant.sigue) + '</span>' : '') +
              '</div><div class="esq-flujo-vacio"></div>';
      }
      if (n.tipo === 'decision'){
        fl += '<div class="esq-rombo"><span>' + esc(n.pregunta) + '</span></div>';
        var r = n.rama || {};
        fl += '<div class="esq-rama"><div class="esq-flecha-h"><span>' + esc(r.etiqueta || '') + '</span>' + icono('flecha-derecha') + '</div>' +
              '<div class="esq-rama-card"><b>' + esc(r.titulo || '') + '</b> ' + esc(r.texto || '') + '</div></div>';
      } else {
        fl += '<div class="esq-nodo' + (n.destacado ? ' destacado' : '') + '">' +
              '<b>' + (n.n != null ? esc(n.n) + ' · ' : '') + esc(n.titulo) + '</b> ' + esc(n.texto || '') + '</div>' +
              '<div class="esq-flujo-vacio"></div>';
      }
    });
    return fl + '</div>' + (b.nota ? '<p class="esq-nota">' + esc(b.nota) + '</p>' : '') + '</div>';
  }

  if (b.tipo === 'cpb'){
    // { pasos:[{n, titulo, texto}, {n, titulo, texto}, {n, titulo, texto}] } : característica → puente → beneficio
    var ps3 = b.pasos || [];
    var p1 = ps3[0] || {}, p2 = ps3[1] || {}, p3 = ps3[2] || {};
    var arco = '<svg viewBox="0 0 400 120" preserveAspectRatio="none" aria-hidden="true">' +
               '<path d="M0 110 C 120 10, 280 10, 400 110" fill="none" stroke="#D9DCE3" stroke-width="7" transform="translate(0,6)"/>' +
               '<path d="M0 110 C 120 10, 280 10, 400 110" fill="none" stroke="#D9DCE3" stroke-width="5" transform="translate(0,-6)"/>' +
               '<path d="M0 110 C 120 10, 280 10, 400 110" fill="none" stroke="#FF4F12" stroke-width="6"/>' +
               '</svg>' +
               '<svg viewBox="0 0 24 24" style="width:22px;height:22px;position:absolute;right:-8px;bottom:-10px" aria-hidden="true"><path d="M12 2 22 20H2z" fill="#FF4F12" transform="rotate(35 12 12)"/></svg>';
    return '<div class="esq"><div class="esq-cpb">' +
      '<div><div class="esq-cpb-card"><div class="esq-cpb-n">' + esc(p1.n != null ? p1.n : 1) + '</div><h4>' + esc(p1.titulo) + '</h4></div>' +
      '<div class="esq-cpb-texto medio">' + esc(p1.texto || '') + '</div></div>' +
      '<div class="esq-cpb-flecha-m">' + icono('flecha-abajo') + '</div>' +
      '<div class="esq-cpb-puente"><div class="esq-cpb-n naranja">' + esc(p2.n != null ? p2.n : 2) + '</div><h4>' + esc(p2.titulo) + '</h4>' +
      '<div style="position:relative">' + arco + '</div>' +
      '<div class="esq-cpb-texto medio">' + esc(p2.texto || '') + '</div></div>' +
      '<div class="esq-cpb-flecha-m">' + icono('flecha-abajo') + '</div>' +
      '<div><div class="esq-cpb-card borde"><div class="esq-cpb-n naranja">' + esc(p3.n != null ? p3.n : 3) + '</div><h4>' + esc(p3.titulo) + '</h4></div>' +
      '<div class="esq-cpb-texto fuerte">' + esc(p3.texto || '') + '</div></div>' +
      '</div></div>';
  }

  if (b.tipo === 'bloques-numerados'){
    // { titulo, bloques:[{n, titulo, items:[], texto, nota, destacado}], nota }
    var bn = '<div class="esq">' + (b.titulo ? '<div class="esq-titulo">' + esc(b.titulo) + '</div>' : '');
    (b.bloques || []).forEach(function(bl, k){
      if (k > 0) bn += '<div class="esq-flecha" style="justify-content:flex-start;padding-left:36px">' + icono('flecha-abajo') + '</div>';
      bn += '<div class="esq-bloque' + (bl.destacado ? ' destacado' : '') + '">' +
            '<div class="esq-bloque-cab"><div class="esq-bloque-n">' + esc(bl.n != null ? bl.n : (k + 1)) + '</div><h4>' + esc(bl.titulo) + '</h4></div>' +
            '<div>' + (bl.items ? '<ul class="esq-ul">' + bl.items.map(function(it){ return '<li>' + esc(it) + '</li>'; }).join('') + '</ul>' : '') +
            (bl.texto ? '<p>' + esc(bl.texto) + '</p>' : '') + '</div>' +
            (bl.nota ? '<div class="esq-bloque-nota">' + esc(bl.nota) + '</div>' : '<div></div>') +
            '</div>';
    });
    return bn + (b.nota ? '<p class="esq-nota">' + esc(b.nota) + '</p>' : '') + '</div>';
  }

  if (b.tipo === 'proceso-qa'){
    // { titulo, pasos:[{n, titulo, texto, negrita, items, etiquetas:[{ok, texto}]}],
    //   ejemplo:{titulo, pasos:[{letra, texto, ok}], resultado, escala:[{rango, puntos, activo}]},
    //   graves:{titulo, texto, items:[]} }
    var q = '<div class="esq">' + (b.titulo ? '<div class="esq-titulo">' + esc(b.titulo) + '</div>' : '') + '<div class="esq-qa-pasos">';
    (b.pasos || []).forEach(function(s, k){
      if (k > 0) q += '<div class="esq-flecha-h">' + icono('flecha-derecha') + '</div>';
      q += '<div class="esq-qa-paso"><div class="esq-qa-cab"><div class="esq-n cliente">' + esc(s.n != null ? s.n : (k + 1)) + '</div><h4>' + esc(s.titulo) + '</h4></div>' +
           (s.texto ? '<p>' + esc(s.texto) + (s.negrita ? '<b>' + esc(s.negrita) + '</b>' : '') + '</p>' : '') +
           (s.items ? '<ul class="esq-ul">' + s.items.map(function(it){ return '<li>' + esc(it) + '</li>'; }).join('') + '</ul>' : '') +
           (s.etiquetas ? '<div class="esq-qa-si">' + s.etiquetas.map(function(e){
              return '<span class="pildora ' + (e.ok ? 'ok' : 'no') + '">' + icono(e.ok ? 'check' : 'cruz', 'esq-qa-mini') + ' ' + esc(e.texto) + '</span>';
            }).join('') + '</div>' : '') +
           '</div>';
    });
    q += '</div>';
    var ej = b.ejemplo;
    if (ej){
      q += '<div class="esq-qa-ejemplo"><h4>' + esc(ej.titulo) + '</h4><div class="esq-qa-grid">';
      (ej.pasos || []).forEach(function(s){
        q += '<div class="esq-qa-item ' + (s.ok ? 'ok' : 'no') + '"><div class="esq-qa-letra"><span>' + esc(s.letra) + '</span>' + icono(s.ok ? 'check' : 'cruz') + '</div>' + esc(s.texto) + '</div>';
      });
      q += '</div>' + (ej.resultado ? '<div class="esq-qa-res">' + esc(ej.resultado) + '</div>' : '') +
           '<div class="esq-escala">' + (ej.escala || []).map(function(e){
             return '<div' + (e.activo ? ' class="activo"' : '') + '>' + esc(e.rango) + '<b>' + esc(e.puntos) + '</b></div>';
           }).join('') + '</div></div>';
    }
    var gr = b.graves;
    if (gr){
      q += '<div class="esq-graves"><div class="esq-graves-ico">!</div><div><h4>' + esc(gr.titulo) + '</h4><p>' + esc(gr.texto || '') + '</p></div>' +
           '<div class="esq-graves-lista">' + (gr.items || []).map(function(it){ return '<span>' + esc(it) + '</span>'; }).join('') + '</div></div>';
    }
    return q + '</div>';
  }

  if (b.tipo === 'columnas-atributos'){
    // { titulo, subtitulo, leyenda, subtitulo2, columnas:[{n, titulo, sub, pasos:[{letra, texto, siAplica}], escala:[{rango, puntos, tono:'medio'|'activo'}]}] }
    var ca = '<div class="esq">' + (b.titulo ? '<div class="esq-titulo">' + esc(b.titulo) + '</div>' : '') +
             (b.subtitulo ? '<div class="esq-sub2">' + esc(b.subtitulo) +
               (b.leyenda ? ' <span class="pildora aplica">' + esc(b.leyenda) + '</span> ' : '') + esc(b.subtitulo2 || '') + '</div>' : '') +
             '<div class="esq-columnas">';
    (b.columnas || []).forEach(function(col, k){
      ca += '<div class="esq-columna"><div class="esq-columna-cab"><div class="esq-n cliente">' + esc(col.n != null ? col.n : (k + 1)) + '</div><h4>' + esc(col.titulo) + '</h4></div>' +
            (col.sub ? '<div class="esq-columna-sub">' + esc(col.sub) + '</div>' : '');
      (col.pasos || []).forEach(function(s){
        ca += '<div class="esq-columna-paso"><div class="esq-letra">' + esc(s.letra) + '</div><div>' + esc(s.texto) +
              (s.siAplica ? '<span class="pildora aplica">' + esc(b.leyenda || 'si aplica') + '</span>' : '') + '</div></div>';
      });
      ca += '<div class="esq-escala">' + (col.escala || []).map(function(e){
              return '<div class="' + esc(e.tono || '') + '">' + esc(e.rango) + '<b>' + esc(e.puntos) + '</b></div>';
            }).join('') + '</div></div>';
    });
    return ca + '</div>' + (b.nota ? '<p class="esq-nota">' + esc(b.nota) + '</p>' : '') + '</div>';
  }

  return '';
}

// ---------------------------------------------------------------- preguntas (lógica común)
/** 'multiple' si lo dice la pregunta o si tiene más de una opción correcta; si no, 'unica'. */
function tipoPregunta(p){
  if (p.tipo === 'multiple' || p.tipo === 'unica') return p.tipo;
  return idsCorrectas(p).length > 1 ? 'multiple' : 'unica';
}

/** Ids de las opciones correctas: `correcta` en la pregunta (reto) o `correcta:true` en las opciones. */
function idsCorrectas(p){
  if (p.correcta != null) return [p.correcta];
  return p.opciones.filter(function(o){ return o.correcta; }).map(function(o){ return o.id; });
}

/** Una respuesta es correcta solo si el conjunto elegido coincide exactamente con el correcto. */
function esCorrecta_(p, opcionIds){
  var elegidas = (opcionIds || []).slice().sort();
  var correctas = idsCorrectas(p).slice().sort();
  return elegidas.length === correctas.length &&
         elegidas.every(function(id, k){ return id === correctas[k]; });
}

/**
 * Califica una lista de preguntas. respuestas: [{preguntaId, opcionIds:[...]}]
 * Devuelve aciertos, total, detalle por pregunta y el bloque `respuestas` que se envía.
 */
function calificar_(preguntas, respuestas){
  var indice = {};
  preguntas.forEach(function(p){ indice[p.id] = p; });
  var aciertos = 0, detalle = [], envio = [];

  respuestas.forEach(function(r){
    var p = indice[r.preguntaId];
    if (!p) return;
    var elegidas = (r.opcionIds || []).slice().sort();
    var bien = esCorrecta_(p, elegidas);
    if (bien) aciertos++;

    // Sin opciones elegidas → el receptor guarda una fila '(sin respuesta)', correcto no.
    var opciones = elegidas.map(function(id){
      var op = p.opciones.filter(function(o){ return o.id === id; })[0];
      return { id: id, texto: op ? op.texto : '' };
    });
    envio.push({ preguntaId:p.id, tema:p.tema, pregunta:p.texto, correcto:bien, opciones:opciones });
    detalle.push({ preguntaId:p.id, tema:p.tema, correcto:bien });
  });

  return { aciertos: aciertos, total: preguntas.length, detalle: detalle, envio: envio };
}

// ---------------------------------------------------------------- retos de práctica
function pintarReto(r, idx, total){
  var tipo = tipoPregunta(r);
  var ops = barajar(r.opciones);
  var etiqueta = 'Práctica · no se califica' + (total > 1 ? ' · ' + (idx + 1) + ' de ' + total : '');
  var h = '<div class="reto" data-reto="' + idx + '"><div class="reto-et">' + etiqueta + '</div>' +
          '<h3>' + esc(r.texto) + '</h3>' +
          '<div class="tenue">' + (tipo === 'multiple' ? 'Elige todas las que correspondan y comprueba.' : 'Elige una opción.') +
          '</div><div class="opciones">';
  ops.forEach(function(o){
    h += '<button class="opcion" data-tipo="' + tipo + '" data-id="' + esc(o.id) + '">' +
         '<span class="marca"></span><span>' + esc(o.texto) + '</span></button>';
  });
  h += '</div>';
  if (tipo === 'multiple') h += '<button class="btn primario btn-comprobar" disabled>Comprobar</button>';
  return h + '<div class="veredicto-reto"></div></div>';
}

function conectarRetos(retos, moduloId){
  var pendientes = retos.length;
  var cajas = document.querySelectorAll('.reto');

  Array.prototype.forEach.call(cajas, function(caja, idx){
    var r = retos[idx];
    var tipo = tipoPregunta(r);
    var botones = caja.querySelectorAll('.opcion');
    var correctas = idsCorrectas(r);
    var elegidas = [];

    function resolver(ids){
      var bien = esCorrecta_(r, ids);
      Array.prototype.forEach.call(botones, function(x){
        x.disabled = true;
        var xid = x.getAttribute('data-id');
        if (correctas.indexOf(xid) !== -1) x.classList.add('bien');
        else if (ids.indexOf(xid) !== -1) x.classList.add('mal');
      });
      var comprobar = caja.querySelector('.btn-comprobar');
      if (comprobar) comprobar.style.display = 'none';
      caja.querySelector('.veredicto-reto').innerHTML =
        '<div class="veredicto ' + (bien ? 'bien' : 'mal') + '">' +
        '<b>' + (bien ? 'Así es.' : 'No del todo.') + '</b>' + esc(r.explicacion) + '</div>';
      pendientes--;
      if (pendientes <= 0) el('#btnSiguiente').disabled = false;

      if (agente){
        ids.forEach(function(id){
          var textoOp = (r.opciones.filter(function(o){ return o.id === id; })[0] || {}).texto || '';
          enviar({ accion:'practica', nombre:agente.nombre, apellido:agente.apellido,
            r: { modulo:moduloId, preguntaId:r.id, tema:r.tema, pregunta:r.texto,
                 opcionId:id, opcionTexto:textoOp, correcto:bien } });
        });
      }
    }

    Array.prototype.forEach.call(botones, function(b){
      b.onclick = function(){
        var id = b.getAttribute('data-id');
        if (tipo !== 'multiple'){ resolver([id]); return; }
        var k = elegidas.indexOf(id);
        if (k >= 0){ elegidas.splice(k, 1); b.classList.remove('sel'); }
        else { elegidas.push(id); b.classList.add('sel'); }
        caja.querySelector('.btn-comprobar').disabled = !elegidas.length;
      };
    });
    var comprobar = caja.querySelector('.btn-comprobar');
    if (comprobar) comprobar.onclick = function(){ if (elegidas.length) resolver(elegidas.slice()); };
  });
}

// ---------------------------------------------------------------- quiz del módulo
function pintarQuiz(p){
  if (revisiones[p.modulo.id]){ pintarRevision(p); return; }
  respuestasQuiz = {};
  var c = p.modulo.quiz;
  var h = '<h2>' + esc(c.titulo) + '</h2><p class="tenue">' + esc(c.intro) + '</p>';

  c.preguntas.forEach(function(p, idx){
    var ops = barajar(p.opciones);
    var tipo = tipoPregunta(p);
    h += '<div class="tarjeta" data-pregunta="' + esc(p.id) + '">' +
         '<div class="reto-et">Pregunta ' + (idx + 1) + ' de ' + c.preguntas.length + '</div>' +
         '<h3>' + esc(p.texto) + '</h3>' +
         '<div class="tenue">' + (tipo === 'multiple' ? 'Elige todas las correctas.' : 'Elige una opción.') + '</div>' +
         '<div class="opciones">';
    ops.forEach(function(o){
      h += '<button class="opcion" data-tipo="' + tipo + '" data-preg="' + esc(p.id) +
           '" data-id="' + esc(o.id) + '"><span class="marca"></span><span>' +
           esc(o.texto) + '</span></button>';
    });
    h += '</div></div>';
  });

  h += '<div class="error" id="errorQuiz"></div>';
  el('#lienzo').innerHTML = h;
  el('#btnSiguiente').textContent = 'Ver cómo te fue';
  el('#btnSiguiente').disabled = false;

  conectarOpciones(respuestasQuiz, null);
}

/** Selección de opciones en una página de preguntas (quiz o certificación). */
function conectarOpciones(respuestas, alCambiar){
  Array.prototype.forEach.call(document.querySelectorAll('.opcion'), function(b){
    b.onclick = function(){
      var preg = b.getAttribute('data-preg');
      var id = b.getAttribute('data-id');
      var tipo = b.getAttribute('data-tipo');
      respuestas[preg] = respuestas[preg] || [];
      var lista = respuestas[preg];

      if (tipo === 'multiple'){
        var k = lista.indexOf(id);
        if (k >= 0){ lista.splice(k, 1); b.classList.remove('sel'); }
        else { lista.push(id); b.classList.add('sel'); }
      } else {
        respuestas[preg] = [id];
        Array.prototype.forEach.call(
          document.querySelectorAll('.opcion[data-preg="' + preg + '"]'),
          function(x){ x.classList.remove('sel'); });
        b.classList.add('sel');
      }
      if (alCambiar) alCambiar();
    };
  });
}

function buscarModulo_(moduloId){
  for (var k = 0; k < curso.modulos.length; k++){
    if (curso.modulos[k].id === moduloId) return curso.modulos[k];
  }
  return null;
}

/**
 * Revisa el quiz de un módulo en el cliente, actualiza modulosHechos / estado en
 * localStorage y envía las respuestas al receptor. respuestas: [{preguntaId, opcionIds:[...]}]
 */
function revisarQuiz(moduloId, respuestas){
  var modulo = buscarModulo_(moduloId);
  if (!modulo) throw new Error('Módulo desconocido: ' + moduloId);
  if (!agente) throw new Error('No te encontramos. Vuelve a escribir tu nombre.');

  var prog = leerProgreso(agente.clave);
  var hechos = prog.modulosHechos.slice();
  var res = calificar_(modulo.quiz.preguntas, respuestas);

  if (hechos.indexOf(moduloId) === -1) hechos.push(moduloId);
  var completo = hechos.length >= curso.modulos.length;
  var ahora = new Date().toISOString();

  guardarProgreso(agente.clave, {
    modulosHechos: hechos,
    estado: completo ? 'terminado' : 'en progreso',
    fechaTermino: completo ? (prog.fechaTermino || ahora) : prog.fechaTermino
  });
  agente.modulosHechos = hechos;
  agente.estado = completo ? 'terminado' : 'en progreso';

  enviar({ accion:'quiz', nombre:agente.nombre, apellido:agente.apellido,
           tipo: 'quiz', moduloId: moduloId, respuestas: res.envio });

  return { aciertos: res.aciertos, total: res.total, detalle: res.detalle,
           modulosHechos: hechos, cursoTerminado: completo };
}

function enviarQuiz(paso){
  var c = paso.modulo.quiz;
  var faltan = c.preguntas.filter(function(p){
    return !respuestasQuiz[p.id] || !respuestasQuiz[p.id].length;
  });
  var err = el('#errorQuiz');
  if (faltan.length){
    err.textContent = 'Te faltan ' + faltan.length + ' pregunta(s) por contestar.';
    err.classList.add('ver');
    return;
  }
  err.classList.remove('ver');
  el('#btnSiguiente').disabled = true;
  el('#btnSiguiente').textContent = 'Revisando…';

  var payload = c.preguntas.map(function(p){
    return { preguntaId:p.id, opcionIds:respuestasQuiz[p.id] };
  });

  try {
    var res = revisarQuiz(paso.modulo.id, payload);
    revisiones[paso.modulo.id] = res;
    pintar();
  } catch(e){
    err.textContent = e.message || 'No se pudo enviar. Intenta de nuevo.';
    err.classList.add('ver');
    el('#btnSiguiente').disabled = false;
    el('#btnSiguiente').textContent = 'Ver cómo te fue';
  }
}

// Revisión del quiz: se queda en el mismo paso, debajo del título del módulo.
function pintarRevision(paso){
  var r = revisiones[paso.modulo.id];
  var indice = {};
  paso.modulo.quiz.preguntas.forEach(function(p){ indice[p.id] = p; });
  var fallos = (r.detalle || []).filter(function(d){ return !d.correcto; });

  var h = '<div class="tarjeta">' +
    '<h2 style="margin:0 0 6px">Módulo ' + paso.n + ' terminado</h2>' +
    '<p class="tenue">Contestaste bien ' + r.aciertos + ' de ' + r.total +
    '. El quiz no lleva calificación: sirve para ver qué repasar.</p>' +
    '<button class="btn" id="btnRepetir">Repetir el quiz</button></div>' +
    '<h2>' + (fallos.length ? 'Qué conviene repasar' : 'Repaso de las respuestas') + '</h2>';

  (r.detalle || []).forEach(function(d){
    var p = indice[d.preguntaId];
    if (!p) return;
    var correctas = p.opciones.filter(function(o){ return o.correcta; })
                      .map(function(o){ return o.texto; }).join(' · ');
    h += '<div class="tarjeta" style="border-left:3px solid ' +
         (d.correcto ? 'var(--verde)' : 'var(--naranja)') + '">' +
         '<div class="reto-et">' + esc(curso.temas[d.tema] || d.tema) + '</div>' +
         '<h3>' + esc(p.texto) + '</h3>' +
         '<p class="tenue"><b>' + (d.correcto ? 'La tenías. ' : 'Respuesta correcta: ') + '</b>' +
         (d.correcto ? '' : esc(correctas)) + '</p>' +
         '<p class="tenue">' + esc(p.explicacion) + '</p></div>';
  });

  el('#lienzo').innerHTML = h;
  el('#btnSiguiente').disabled = false;
  el('#btnSiguiente').textContent =
    (i === pasos.length - 2) ? ('Terminar el ' + nombreDia()) : 'Siguiente módulo';
  el('#btnRepetir').onclick = function(){
    delete revisiones[paso.modulo.id];
    pintar();
  };
}

function pintarResultado(){
  var cierre = curso.cierre || (dia === 1
    ? { titulo: 'Terminaste el Día 1',
        texto: 'Pasaste por los cuatro módulos. Nada de esto llevó calificación: el Día 2 ' +
               'cierra con la certificación, y ahí sí hay puntaje.' }
    : { titulo: 'Terminaste el ' + nombreDia(),
        texto: 'Pasaste por todos los módulos.' });

  var h = '<div class="portada"><h1>' + esc(cierre.titulo) + '</h1>' +
    '<p>' + esc(cierre.texto) + '</p></div>' +
    '<h2>Cómo te fue por módulo</h2>';

  curso.modulos.forEach(function(m, mi){
    var r = revisiones[m.id];
    var fallos = r ? (r.detalle || []).filter(function(d){ return !d.correcto; }) : [];
    var temas = [];
    fallos.forEach(function(d){
      var t = curso.temas[d.tema] || d.tema;
      if (temas.indexOf(t) === -1) temas.push(t);
    });
    h += '<div class="tarjeta"><div class="reto-et">Módulo ' + (mi + 1) + '</div>' +
         '<h3>' + esc(m.titulo) + '</h3>' +
         '<p class="tenue">' + (r
            ? ('Contestaste bien ' + r.aciertos + ' de ' + r.total +
               (temas.length ? '. Temas por repasar: ' + esc(temas.join(', ')) : '.'))
            : 'Sin quiz contestado.') + '</p></div>';
  });

  h += '<button class="btn" id="btnVolver">Volver al inicio del curso</button> ' +
       '<button class="btn" id="btnPortada">Ir a la portada</button>';
  el('#lienzo').innerHTML = h;
  el('#pie').style.display = 'none';
  el('#barraProgreso').style.width = '100%';
  el('#btnVolver').onclick = function(){ i = 1; pintar(); };
  el('#btnPortada').onclick = pintarTitular;
}

// ---------------------------------------------------------------- certificación (Día 2)
/**
 * Los módulos sin quiz se dan por hechos al llegar a la certificación: se envía
 * accion='quiz' con respuestas vacías una sola vez por módulo.
 */
function cerrarModulosSinQuiz(){
  if (!agente) return;
  var prog = leerProgreso(agente.clave);
  var hechos = prog.modulosHechos.slice(), nuevos = false;
  curso.modulos.forEach(function(m){
    if (m.quiz || hechos.indexOf(m.id) !== -1) return;
    hechos.push(m.id); nuevos = true;
    enviar({ accion:'quiz', nombre:agente.nombre, apellido:agente.apellido,
             tipo:'quiz', moduloId:m.id, respuestas:[] });
  });
  if (nuevos){
    guardarProgreso(agente.clave, { modulosHechos: hechos });
    agente.modulosHechos = hechos;
  }
}

function estadoCert(){
  return agente ? leerProgreso(agente.clave).cert : { intentos: [] };
}

function certTerminada(c){
  var ultimo = c.intentos[c.intentos.length - 1];
  return !!ultimo && (ultimo.aprobada || c.intentos.length >= CERT.intentosMaximos);
}

function contarCert(){
  return CERT.preguntas.filter(function(p){
    return respuestasCert[p.id] && respuestasCert[p.id].length;
  }).length;
}

function pintarCert(){
  cerrarModulosSinQuiz();
  var c = estadoCert();
  var ultimo = c.intentos[c.intentos.length - 1] || null;
  var terminada = certTerminada(c);

  if (terminada) certFase = 'resultado';
  else if (certFase !== 'preguntas') certFase = ultimo ? 'resultado' : 'intro';

  if (certFase === 'intro') pintarCertIntro();
  else if (certFase === 'preguntas') pintarCertPreguntas(c.intentos.length + 1);
  else pintarCertResultado(ultimo, terminada);
}

/** Repinta el paso de certificación sin volver a guardar el avance. */
function repintarCert(){
  window.scrollTo(0,0);
  pintarCert();
  actualizarCromo(pasos[i]);
}

function pintarCertIntro(){
  var n = CERT.preguntas.length;
  el('#lienzo').innerHTML =
    '<div class="portada"><div class="reto-et" style="color:#fff;opacity:.85">Día 2 · cierre del curso</div>' +
    '<h1>' + esc(CERT.titulo) + '</h1><p>' + esc(CERT.intro) + '</p></div>' +
    '<h2>Cómo funciona</h2>' +
    '<div class="rejilla reglas">' +
      '<div class="tarjeta"><h3>' + n + ' preguntas</h3><div class="tenue">Sobre el curso completo: Día 1 y Día 2. Todas en una sola página.</div></div>' +
      '<div class="tarjeta"><h3>' + CERT.minimoCorrectas + ' correctas para aprobar</h3><div class="tenue">De ' + n + '. Al enviar ves tu puntaje y los temas por repasar.</div></div>' +
      '<div class="tarjeta"><h3>' + CERT.intentosMaximos + ' intentos</h3><div class="tenue">Si no apruebas a la primera, tienes un segundo intento.</div></div>' +
      '<div class="tarjeta"><h3>Sin revisión al instante</h3><div class="tenue">No se muestra la respuesta correcta de cada pregunta. Los resultados los revisas con tu entrenador.</div></div>' +
    '</div>' +
    '<div class="aviso info">Responde con calma: solo puedes enviar cuando hayas contestado las ' + n + ' preguntas.</div>';
  el('#btnSiguiente').disabled = false;
  el('#btnSiguiente').textContent = 'Empezar la certificación';
}

function empezarCert(){
  var c = estadoCert();
  if (certTerminada(c)) { certFase = 'resultado'; repintarCert(); return; }
  respuestasCert = {}; ordenCert = {};
  CERT.preguntas.forEach(function(p){ ordenCert[p.id] = barajar(p.opciones); });
  certFase = 'preguntas';
  repintarCert();
}

function pintarCertPreguntas(intentoN){
  var n = CERT.preguntas.length;
  var h = '<h2>' + esc(CERT.titulo) + '</h2>' +
    '<p class="tenue">Intento ' + intentoN + ' de ' + CERT.intentosMaximos + ' · ' + n +
    ' preguntas · necesitas ' + CERT.minimoCorrectas + ' correctas. No verás la respuesta correcta de cada pregunta.</p>' +
    '<div class="contador" id="contadorCert"></div>';

  CERT.preguntas.forEach(function(p, idx){
    var tipo = tipoPregunta(p);
    var ops = ordenCert[p.id] || (ordenCert[p.id] = barajar(p.opciones));
    var marcadas = respuestasCert[p.id] || [];
    h += '<div class="tarjeta" data-pregunta="' + esc(p.id) + '">' +
         '<div class="reto-et">Pregunta ' + (idx + 1) + ' de ' + n + '</div>' +
         '<h3>' + esc(p.texto) + '</h3>' +
         '<div class="tenue">' + (tipo === 'multiple' ? 'Elige todas las correctas.' : 'Elige una opción.') + '</div>' +
         '<div class="opciones">';
    ops.forEach(function(o){
      h += '<button class="opcion' + (marcadas.indexOf(o.id) !== -1 ? ' sel' : '') +
           '" data-tipo="' + tipo + '" data-preg="' + esc(p.id) +
           '" data-id="' + esc(o.id) + '"><span class="marca"></span><span>' +
           esc(o.texto) + '</span></button>';
    });
    h += '</div></div>';
  });

  h += '<div class="error" id="errorCert"></div>';
  el('#lienzo').innerHTML = h;

  function refrescar(){
    var k = contarCert();
    el('#contadorCert').textContent = 'Respondidas ' + k + ' de ' + n;
    el('#pieEtiqueta').textContent = 'Respondidas ' + k + ' de ' + n;
    el('#btnSiguiente').disabled = (k < n);
    el('#btnSiguiente').textContent = 'Enviar certificación';
    if (k >= n) el('#errorCert').classList.remove('ver');
  }
  conectarOpciones(respuestasCert, refrescar);
  refrescar();
}

/**
 * Califica la certificación en el cliente (misma regla que el quiz: una pregunta múltiple
 * solo es correcta con el conjunto exacto), guarda el intento y envía las respuestas.
 */
function revisarCertificacion(respuestas){
  if (!agente) throw new Error('No te encontramos. Vuelve a escribir tu nombre.');
  var prog = leerProgreso(agente.clave);
  if (prog.cert.intentos.length >= CERT.intentosMaximos)
    throw new Error('Ya usaste tus ' + CERT.intentosMaximos + ' intentos.');

  var res = calificar_(CERT.preguntas, respuestas);
  var aprobada = res.aciertos >= CERT.minimoCorrectas;
  var temas = [];
  res.detalle.forEach(function(d){
    if (d.correcto) return;
    var t = CERT.temas[d.tema] || d.tema;
    if (temas.indexOf(t) === -1) temas.push(t);
  });
  var ahora = new Date().toISOString();
  var intento = { n: prog.cert.intentos.length + 1, aciertos: res.aciertos, total: res.total,
                  aprobada: aprobada, temas: temas, fecha: ahora };
  var intentos = prog.cert.intentos.concat([intento]);
  var terminada = aprobada || intentos.length >= CERT.intentosMaximos;

  var hechos = prog.modulosHechos.slice();
  if (hechos.indexOf(CERT.id) === -1) hechos.push(CERT.id);

  guardarProgreso(agente.clave, {
    cert: { intentos: intentos },
    modulosHechos: hechos,
    estado: terminada ? 'terminado' : 'en progreso',
    fechaTermino: terminada ? (prog.fechaTermino || ahora) : prog.fechaTermino
  });
  agente.modulosHechos = hechos;
  agente.estado = terminada ? 'terminado' : 'en progreso';

  enviar({ accion:'quiz', nombre:agente.nombre, apellido:agente.apellido,
           tipo:'certificacion', moduloId: CERT.id, respuestas: res.envio });
  return intento;
}

function enviarCert(){
  var faltan = CERT.preguntas.length - contarCert();
  var err = el('#errorCert');
  if (faltan > 0){
    err.textContent = 'Te faltan ' + faltan + ' pregunta(s) por contestar.';
    err.classList.add('ver');
    return;
  }
  err.classList.remove('ver');
  el('#btnSiguiente').disabled = true;
  el('#btnSiguiente').textContent = 'Enviando…';

  var payload = CERT.preguntas.map(function(p){
    return { preguntaId:p.id, opcionIds:respuestasCert[p.id] };
  });
  try {
    revisarCertificacion(payload);
    respuestasCert = {}; ordenCert = {};
    certFase = 'resultado';
    repintarCert();
  } catch(e){
    err.textContent = e.message || 'No se pudo enviar. Intenta de nuevo.';
    err.classList.add('ver');
    el('#btnSiguiente').disabled = false;
    el('#btnSiguiente').textContent = 'Enviar certificación';
  }
}

function pintarCertResultado(intento, terminada){
  var h = '<div class="tarjeta resultado-cert">' +
    '<div class="reto-et">' + esc(CERT.titulo) + ' · intento ' + intento.n + ' de ' + CERT.intentosMaximos + '</div>' +
    '<div class="marcador">' + intento.aciertos + ' de ' + intento.total + '</div>' +
    '<h2 class="' + (intento.aprobada ? 'aprobada' : 'reprobada') + '">' +
    (intento.aprobada ? 'Aprobada' : 'No aprobada') + '</h2>' +
    '<p class="tenue">Para aprobar necesitas ' + CERT.minimoCorrectas + ' respuestas correctas de ' + intento.total + '.</p>' +
    '</div>';

  if (intento.temas && intento.temas.length){
    h += '<h2>Temas por repasar</h2><div class="tarjeta"><ul class="lista" style="margin:0">';
    intento.temas.forEach(function(t){ h += '<li>' + esc(t) + '</li>'; });
    h += '</ul></div>';
  } else {
    h += '<div class="aviso ok">Contestaste bien todas las preguntas.</div>';
  }
  h += '<p class="tenue">En la certificación no se muestran las respuestas correctas de cada pregunta.</p>';

  if (terminada){
    h += '<div class="aviso info">Tu entrenador revisa los resultados y te los comparte.</div>' +
         '<button class="btn" id="btnRepasar">Volver al módulo</button> ' +
         '<button class="btn primario" id="btnPortadaCert">Ir a la portada</button>';
  } else {
    h += '<div class="aviso info">Te queda un intento. Repasa los temas y vuelve a intentarlo cuando quieras.</div>' +
         '<button class="btn primario" id="btnSegundo">Segundo intento</button> ' +
         '<button class="btn" id="btnRepasar">Volver al módulo</button> ' +
         '<button class="btn" id="btnPortadaCert">Ir a la portada</button>';
  }

  el('#lienzo').innerHTML = h;
  el('#barraProgreso').style.width = '100%';
  var segundo = el('#btnSegundo');
  if (segundo) segundo.onclick = empezarCert;
  el('#btnRepasar').onclick = function(){ i = 1; pintar(); };
  el('#btnPortadaCert').onclick = pintarTitular;
}

// ---------------------------------------------------------------- navegación
el('#btnSiguiente').onclick = function(){
  var p = pasos[i];
  if (p.tipo === 'quiz' && !revisiones[p.modulo.id]){ enviarQuiz(p); return; }
  if (p.tipo === 'cert'){
    if (certFase === 'intro') empezarCert();
    else if (certFase === 'preguntas') enviarCert();
    return;
  }
  if (i < pasos.length - 1){ i++; pintar(); }
};
el('#btnAtras').onclick = function(){
  var p = pasos[i];
  if (p.tipo === 'cert' && certFase === 'preguntas') return;
  if (i > 1){ i--; pintar(); }
};

el('#btnIndice').onclick = function(){ abrirIndice(true); };
el('#btnInicioBarra').onclick = function(){ abrirIndice(false); pintarTitular(); };
el('#velo').onclick = function(){ abrirIndice(false); };

function abrirIndice(ver){
  el('#indice').classList.toggle('ver', ver);
  el('#velo').classList.toggle('ver', ver);
  if (ver) pintarIndice();
}

/** Navegación libre: todos los módulos y pantallas del día están abiertos, sin importar el avance. */
function pintarIndice(){
  var h = '';
  var visto = Math.max(maxVisto, agente ? (agente.pasoActual || 0) : 0);
  pasos.forEach(function(p, idx){
    if (p.tipo === 'identidad' || p.tipo === 'resultado') return;
    if (p.tipo === 'pantalla'){
      h += '<button class="idx-item idx-sub' + (idx === i ? ' actual' : '') + '" data-idx="' + idx + '">' +
           esc(p.pantalla.titulo) + '</button>';
      return;
    }
    var titulo = p.tipo === 'modulo' ? p.modulo.titulo
               : p.tipo === 'quiz' ? ('↳ ' + p.modulo.quiz.titulo)
               : CERT.titulo;
    var clase = 'idx-item' + (idx === i ? ' actual' : '') + (idx < visto ? ' hecho' : '');
    h += '<button class="' + clase + '" data-idx="' + idx + '">' +
         '<span class="idx-n">' + (p.tipo === 'modulo' ? p.n : (p.tipo === 'cert' ? '★' : '?')) + '</span>' +
         '<span>' + esc(titulo) + '</span></button>';
  });
  el('#indiceLista').innerHTML = h;
  Array.prototype.forEach.call(document.querySelectorAll('.idx-item'), function(b){
    b.onclick = function(){
      i = parseInt(b.getAttribute('data-idx'), 10);
      abrirIndice(false);
      pintar();
    };
  });
}

arrancar();
</script>
