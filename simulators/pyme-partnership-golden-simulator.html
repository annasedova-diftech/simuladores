<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Simulador — PyME Partnership · Golden user</title>
<meta name="sim:category" content="PyME">
<meta name="sim:title" content="PyME Partnership · Golden user">
<meta name="sim:description" content="Flujo de venta PyME Partnership con usuario golden.">
<style>
  :root{
    --bg:#f4f5f8;--panel:#ffffff;--text:#161a1f;--muted:#8a9099;--line:#e7e9ef;
    --field:#eceef4;--field2:#e4e7f0;--orange:#f9531e;--orange-dark:#e2440f;
    --purple:#2d00ff;--purple-soft:#ece7ff;--yellow:#fff6da;--green:#12bf4b;--red:#ff3b30;
    --shadow:0 10px 40px rgba(15,23,42,.12);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:#0c1526;color:var(--text);
    font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    display:grid;place-items:center;padding:22px;}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  input,textarea{font:inherit;color:inherit}
  .app{width:min(1180px,100%);height:min(760px,calc(100vh - 44px));background:var(--panel);
    border-radius:18px;overflow:hidden;box-shadow:0 30px 90px rgba(6,14,30,.45);
    display:flex;flex-direction:column;position:relative;isolation:isolate;}
  .topstrip{height:6px;background:linear-gradient(90deg,#5a3a25,#7a4a2c)}
  .callbar{height:60px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
    padding:0 26px;border-bottom:1px solid var(--line);background:#fff;}
  .callnums{font-size:15px;color:#3d434c;font-weight:600;letter-spacing:.3px}
  .callctrls{display:flex;align-items:center;gap:16px}
  .cc-btn{width:44px;height:34px;border-radius:9px;display:grid;place-items:center;background:#eef0f4;color:#6b7079;transition:.15s}
  .cc-btn:hover{background:#e4e7ec}
  .cc-btn.muted{background:#e3e6eb;color:#4b515a}
  .cc-btn.hang{width:56px;background:#ffe1de;color:var(--red)}
  .cc-btn.hang:hover{background:#ffd0cb}
  .cc-btn.hang.ended{background:var(--red);color:#fff}
  .calltimer{justify-self:end;font-variant-numeric:tabular-nums;color:#5a616b;font-size:15px;font-weight:600}
  .split{flex:1;display:grid;grid-template-columns:1fr 340px;min-height:0}
  .left{overflow-y:auto;padding:26px 34px 40px}
  .right{border-left:1px solid var(--line);background:#fff;overflow-y:auto;padding:22px 20px 26px}
  .banner{background:var(--yellow);border-left:5px solid var(--orange);border-radius:10px;
    padding:14px 18px;color:#6b5a1c;font-weight:600;font-size:15px;margin-bottom:26px;}
  .left h1{font-size:23px;font-weight:800;letter-spacing:-.3px;margin:0 0 20px;line-height:1.3}
  .left h2{font-size:19px;font-weight:800;margin:30px 0 4px}
  .left .lead{font-size:15px;color:#5b616b;margin:0 0 16px;line-height:1.45}
  .btn{min-height:52px;border-radius:11px;font-weight:700;font-size:16px;display:flex;
    align-items:center;justify-content:center;gap:10px;padding:0 22px;transition:.15s;}
  .btn.primary{background:var(--orange);color:#fff;flex:1}
  .btn.primary:hover{background:var(--orange-dark)}
  .btn.secondary{background:#eef0f4;color:#2b3038;flex:1}
  .btn.secondary:hover{background:#e4e7ec}
  .btn.full{width:100%;max-width:660px}
  .btn-row{display:flex;gap:16px;margin-top:6px;max-width:660px;flex-direction:column}
  .infobox{background:#f0efff;border-left:5px solid var(--purple);border-radius:10px;
    padding:16px 18px;max-width:660px;margin:0 auto 22px;}
  .infobox b{display:block;font-size:15px;margin-bottom:5px;color:#20223a}
  .infobox ol{margin:6px 0 0;padding-left:20px;color:#4a4d63;font-size:14px;line-height:1.7}
  .infobox ol b{display:inline;color:#20223a}
  .field-group{max-width:660px}
  .radio-card{max-width:660px}
  .radio-row{display:flex;align-items:center;gap:14px;padding:15px 16px;border-radius:12px;cursor:pointer;
    border:2px solid transparent;transition:.12s;}
  .radio-row .rtitle{flex:1;font-size:16px}
  .radio-row .rmeta{color:var(--muted);font-size:15px}
  .radio-row:hover{background:#f6f7fa}
  .radio-row.on{background:#f0efff}
  .radio{width:22px;height:22px;border-radius:50%;border:2px solid #b7bcc6;flex:0 0 auto;display:grid;place-items:center;transition:.12s}
  .radio.on{border-color:var(--purple)}
  .radio.on::after{content:"";width:11px;height:11px;border-radius:50%;background:var(--purple)}
  .list-box{border:1px solid var(--line);border-radius:14px;padding:6px;max-width:660px}
  .plan-list .radio-row{margin:0}
  .plan-list .radio-row.on{background:#f0efff}
  /* left-panel dropdowns */
  .ldd{position:relative;margin-bottom:8px;max-width:660px}
  .ldd-head{width:100%;text-align:left;background:var(--field);border-radius:12px;padding:10px 42px 10px 16px;
    position:relative;min-height:56px;display:flex;flex-direction:column;justify-content:center;
    border:2px solid transparent;transition:.12s;}
  .ldd-head:hover{background:#e4e7ee}
  .ldd.open .ldd-head{border-color:var(--purple);background:#fff}
  .ldd.error .ldd-head{border-color:var(--red)}
  .ldd-label{font-size:12px;color:#8a9099}
  .ldd-value{font-size:16px;color:#161a1f;margin-top:1px}
  .ldd-value.placeholder{color:#a3a8b2}
  .ldd-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px}
  .chip{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid #d7dbe4;
    border-radius:8px;padding:5px 10px;font-size:14px}
  .chip button{color:#9aa0aa;font-size:15px;line-height:1;display:grid;place-items:center}
  .chip button:hover{color:var(--red)}
  .ldd-head .chev{position:absolute;right:16px;top:50%;transform:translateY(-50%);color:#9aa0aa;font-size:12px;transition:.2s}
  .ldd.open .ldd-head .chev{transform:translateY(-50%) rotate(180deg)}
  .ldd-menu{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:30;background:#fff;
    border-radius:12px;box-shadow:var(--shadow);border:1px solid var(--line);
    max-height:260px;overflow-y:auto;padding:6px;display:none;}
  .ldd.open .ldd-menu{display:block}
  .ldd-opt{width:100%;text-align:left;padding:11px 12px;border-radius:8px;font-size:15px;line-height:1.35;
    display:flex;align-items:center;justify-content:space-between;gap:10px;transition:.1s}
  .ldd-opt:hover{background:#f2f3f7}
  .ldd-opt.sel{background:var(--purple-soft);color:var(--purple);font-weight:600}
  .ldd-opt .mk{font-weight:900}
  .err-text{color:var(--red);font-size:13px;margin:6px 2px 18px}
  /* right panel (identical to non-golden) */
  .right h3{font-size:16px;font-weight:800;margin:2px 0 18px;color:#161a1f}
  .rsection{font-size:15px;font-weight:800;margin:20px 0 12px}
  .dd{position:relative;margin-bottom:12px}
  .dd-head{width:100%;text-align:left;background:var(--field);border-radius:11px;padding:9px 40px 9px 15px;
    position:relative;min-height:52px;display:flex;flex-direction:column;justify-content:center;
    border:2px solid transparent;transition:.12s;}
  .dd.callback .dd-head{background:var(--field2)}
  .dd-head:hover{background:#e4e7ee}
  .dd.open .dd-head{border-color:var(--purple);background:#fff}
  .dd-label{font-size:12px;color:#8a9099}
  .dd-value{font-size:14.5px;color:#161a1f;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dd-value.placeholder{color:#a9aeb8;font-size:15px}
  .dd-head .chev{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:#9aa0aa;font-size:12px;transition:.2s}
  .dd.open .dd-head .chev{transform:translateY(-50%) rotate(180deg)}
  .dd-menu{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:30;background:#fff;
    border-radius:12px;box-shadow:var(--shadow);border:1px solid var(--line);
    max-height:260px;overflow-y:auto;padding:6px;display:none;}
  .dd.open .dd-menu{display:block}
  .dd-opt{width:100%;text-align:left;padding:10px 12px;border-radius:8px;font-size:14px;line-height:1.35;transition:.1s}
  .dd-opt:hover{background:#f2f3f7}
  .dd-opt.sel{background:var(--purple-soft);color:var(--purple);font-weight:600}
  .comment-field{background:#fff;border:1.5px solid var(--line);border-radius:11px;padding:9px 15px;margin-bottom:12px;
    min-height:52px;display:flex;flex-direction:column;justify-content:center;transition:.12s;}
  .comment-field:focus-within{border-color:var(--purple)}
  .comment-field label{font-size:12px;color:#8a9099;margin-bottom:2px}
  .comment-field textarea{border:0;outline:0;resize:none;width:100%;font-size:14.5px;background:none;min-height:20px;line-height:1.4}
  .close-task{width:100%;min-height:50px;border-radius:11px;background:#eef0f4;color:#3d434c;font-weight:700;font-size:15px;margin-top:20px;transition:.15s}
  .close-task:hover{background:#e4e7ec}
  .close-task.ready{background:var(--orange);color:#fff}
  .close-task.ready:hover{background:var(--orange-dark)}
  /* endings */
  .end-wrap{max-width:660px;margin:40px auto 0;display:flex;flex-direction:column;align-items:center;text-align:center}
  .doc-illu{width:120px;height:120px;margin:0 auto 24px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#ffd9c8,#f3b79a);display:grid;place-items:center}
  .doc-illu .card{width:56px;height:64px;border-radius:10px;background:#fff;border:3px solid #e7d9cf;position:relative}
  .doc-illu .card::before{content:"";position:absolute;inset:12px 10px;border-radius:3px;
    background:repeating-linear-gradient(#dfe2ea 0 4px,transparent 4px 9px)}
  .warn-illu{width:120px;height:110px;margin:0 auto 24px;display:grid;place-items:center;
    color:#fff;font-size:60px;font-weight:900;
    background:linear-gradient(150deg,#ffb24d,#f08a1e);
    clip-path:polygon(50% 4%,100% 96%,0 96%);}
  .end-note{background:#f0efff;border-left:5px solid var(--purple);border-radius:10px;padding:16px 18px;text-align:left;width:100%}
  .end-note.info{background:#fff;border:1px solid var(--line);border-left:4px solid #c7c2ee}
  .end-note b{display:block;font-size:15px;margin-bottom:6px;color:#20223a}
  .end-note ol{margin:0;padding-left:20px;color:#4a4d63;font-size:14px;line-height:1.7}
  .end-note p{margin:0;color:#4a4d63;font-size:15px;line-height:1.5}
  /* toast + modal */
  .toast{position:absolute;top:74px;left:50%;transform:translateX(-50%);z-index:80;
    background:#161a1f;color:#fff;padding:12px 22px;border-radius:12px;font-size:14.5px;
    box-shadow:var(--shadow);animation:pop .18s ease}
  @keyframes pop{from{opacity:0;transform:translate(-50%,-8px)}to{opacity:1;transform:translate(-50%,0)}}
  .overlay{position:absolute;inset:0;z-index:60;background:rgba(10,16,28,.42);display:grid;place-items:center;animation:fade .15s}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .modal{background:#fff;border-radius:18px;padding:34px 30px;width:min(430px,90%);text-align:center;box-shadow:var(--shadow)}
  .modal .ic{width:76px;height:76px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#17e276,#08bd58);color:#fff;display:grid;place-items:center;font-size:44px;margin:0 auto 18px}
  .modal h2{margin:0 0 10px;font-size:22px}
  .modal p{margin:0 0 24px;color:#5b616b;font-size:15px;line-height:1.5}
  .stepdots{display:flex;gap:7px;margin:0 0 22px}
  .stepdots i{width:26px;height:5px;border-radius:3px;background:#e2e5ec;transition:.2s}
  .stepdots i.on{background:var(--orange)}
  .stepdots i.done{background:#f9a385}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="topstrip"></div>
  <div class="callbar">
    <div class="callnums" id="callnums">… 1445</div>
    <div class="callctrls">
      <button class="cc-btn muted" id="muteBtn" title="Silenciar" data-action="mute">🎙</button>
      <button class="cc-btn hang" id="hangBtn" title="Colgar" data-action="hangup">📞</button>
    </div>
    <div class="calltimer" id="timer">00:00</div>
  </div>
  <div class="split">
    <div class="left" id="left"></div>
    <div class="right" id="right"></div>
  </div>
  <div id="overlayRoot"></div>
</div>

<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);

  const state = {
    step: 0, muted:false, callEnded:false, seconds:0,
    openDD:null, openLDD:null, toast:null, modal:null,
    // left-panel golden data
    employees:'', actividad:'', regimen:[], plan:'Mensual Emprendedor',
    showErr:false, ending:null,
    // right-panel field values (identical to non-golden)
    fields:{ partner:'',entity:'',relation:'',companies:'',employees:'',decision:'',result:'',comment:'',cbDate:'',cbFrom:'',cbUntil:'' }
  };

  // steps (endings are separate terminal screens)
  const steps = ['ready','employees','business','plan'];

  // ---- left-panel option lists ----
  const employeeOpts = ['Solo yo','1 – 10 personas','11 – 50 personas','51 o más personas'];
  const actividadOpts = ['Tienda de ropa y accesorios','Restaurante o cafetería','Comercio al por menor','Comercio al por mayor','Servicios profesionales','Belleza y estética','Salud y bienestar','Construcción','Transporte y logística','Tecnología / Software','Manufactura','Educación','Otro'];
  const regimenOpts = ['Régimen Simplificado de Confianza (RESICO)','Actividades Empresariales y Profesionales','Arrendamiento','Régimen de Enajenación o Adquisición de Bienes','Sueldos y Salarios e Ingresos Asimilados a Salarios','Régimen de Incorporación Fiscal','Personas Morales'];
  const planOpts = [['Independiente','Gratis'],['Mensual Emprendedor','$299.00/mes'],['Annual Emprendedor','$249.00/mes'],['Mensual Empresario','$599.00/mes'],['Annual Empresario','$499.00/mes']];

  // ---- right-panel dropdown definitions (identical to non-golden simulator) ----
  const dropdowns = [
    { key:'partner', label:'Tipo de partner', options:[
      'Contador(a)','Abogado(a)','Consultor fiscal','Representantes del SAT','Consultoría laboral',
      'Distribuidores e integradores de TPV/ERP','Organizaciones gubernamentales','Firmas de contabilidad',
      'Proveedores de software','Asociaciones','Firmas de impuestos',
      'Servicios de constitución y registro de empresas','Agencias administrativas para PyME','Bufetes de abogados',
      'Servicios de representación IMSS / INFONAVIT','Servicios de nómina','Agencia de Recursos Humanos','Otro','No contestó'
    ]},
    { key:'entity', label:'Tipo de entidad del partner', options:['PFAE','Persona moral','Persona física','No contestó'] },
    { key:'relation', label:'Tipo de relación comercial del partner', options:['Comisión','Cartera','No contestó'] },
    { key:'companies', label:'Empresas mensuales', options:[
      'No trabaja con empresas','Sí, de 1 a 10','Sí, de 10 a 30','Sí, de 30 a 200','Sí, más de 200','No contestó'
    ]},
    { key:'employees', label:'Número de empleados', options:[
      '1 empleado','De 1 a 10','De 11 a 50','De 51 a 250','Más de 250','No contestó'
    ]},
    { key:'decision', label:'Decisión', options:['Listo para probar','Hay que pensar','No'] },
    { key:'result', label:'Seleccionar Resultado', options:[
      'Sin respuesta - Buzón de voz','Respuesta - Solicita que le vuelvan a llamar','Respuesta - Éxito',
      'Respuesta - No está de acuerdo','Respuesta - No está de acuerdo - Otro (Especificar)',
      'Respuesta - Reacción de forma negativa','Respuesta - Problema técnico',
      'Sin respuesta - Llamada no disponible / Número incorrecto','Sin respuesta - No contestó',
      'Sin respuesta - Teléfono ocupado','Sin respuesta - Otro (Especificar)','Cierre automático'
    ]},
  ];
  const callbackDD = [
    { key:'cbFrom', label:'Available from (CST)', options:['9:00 a.m.','10:00 a.m.','11:00 a.m.','12:00 p.m.','1:00 p.m.','2:00 p.m.','3:00 p.m.','4:00 p.m.','5:00 p.m.'] },
    { key:'cbUntil', label:'Available until (CST)', options:['10:00 a.m.','11:00 a.m.','12:00 p.m.','1:00 p.m.','2:00 p.m.','3:00 p.m.','4:00 p.m.','5:00 p.m.','6:00 p.m.'] },
  ];

  function esc(v){ return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  const banner = `<div class="banner">Gloria Darian Ortiz Cuervo. Golden user</div>`;
  function dots(){
    const idx = Math.min(state.step, steps.length-1);
    return `<div class="stepdots">${steps.map((_,i)=>`<i class="${i<idx?'done':''}${i===idx?'on':''}"></i>`).join('')}</div>`;
  }

  // ---- left screens ----
  function leftReady(){
    return `${banner}${dots()}
      <h1>¿El cliente está listo para abrir su Cuenta Empresa?</h1>
      <div class="btn-row"><button class="btn primary full" data-action="ready-yes">Sí, continuar</button></div>`;
  }
  function leftEmployees(){
    const rows = employeeOpts.map(o=>`<div class="radio-row ${state.employees===o?'on':''}" data-action="pick-emp" data-v="${esc(o)}"><span class="radio ${state.employees===o?'on':''}"></span><span class="rtitle">${esc(o)}</span></div>`).join('');
    return `${banner}${dots()}
      <h1>Número de empleados</h1>
      <p class="lead">Esto nos ayudará a sugerir el mejor plan para el negocio</p>
      <div class="list-box radio-card">${rows}</div>
      <button class="btn primary full" data-action="next-employees" style="margin-top:26px">Continuar</button>`;
  }
  function leftBusiness(){
    const actErr = state.showErr && !state.actividad;
    const regErr = state.showErr && state.regimen.length===0;
    const actOpen = state.openLDD==='actividad';
    const regOpen = state.openLDD==='regimen';
    const actMenu = actividadOpts.map(o=>`<button class="ldd-opt ${state.actividad===o?'sel':''}" data-action="pick-actividad" data-v="${esc(o)}">${esc(o)}${state.actividad===o?'<span class="mk">✓</span>':''}</button>`).join('');
    const regMenu = regimenOpts.map(o=>`<button class="ldd-opt ${state.regimen.includes(o)?'sel':''}" data-action="toggle-regimen" data-v="${esc(o)}">${esc(o)}${state.regimen.includes(o)?'<span class="mk">✓</span>':''}</button>`).join('');
    const regValue = state.regimen.length
      ? `<div class="ldd-chips">${state.regimen.map(r=>`<span class="chip">${esc(r)}<button data-action="remove-regimen" data-v="${esc(r)}">✕</button></span>`).join('')}</div>`
      : `<span class="ldd-value placeholder">Régimen fiscal</span>`;
    return `${banner}${dots()}
      <h2>Actividad del negocio</h2>
      <p class="lead">Selecciona la actividad que mejor describa el negocio del cliente</p>
      <div class="ldd ${actOpen?'open':''} ${actErr?'error':''}" data-ldd="actividad">
        <button class="ldd-head" data-action="toggle-ldd" data-key="actividad">
          <span class="ldd-label">Actividad del negocio</span>
          <span class="ldd-value ${state.actividad?'':'placeholder'}">${state.actividad?esc(state.actividad):'Actividad del negocio'}</span>
          <span class="chev">▼</span>
        </button>
        <div class="ldd-menu">${actMenu}</div>
      </div>
      ${actErr?'<div class="err-text">Selecciona una opción para continuar</div>':''}
      <h2 style="margin-top:26px">Régimen fiscal</h2>
      <p class="lead">Selecciona el régimen fiscal de la Constancia de Situación Fiscal del cliente</p>
      <div class="ldd ${regOpen?'open':''} ${regErr?'error':''}" data-ldd="regimen">
        <button class="ldd-head" data-action="toggle-ldd" data-key="regimen">
          <span class="ldd-label">Régimen fiscal</span>
          ${regValue}
          <span class="chev">▼</span>
        </button>
        <div class="ldd-menu">${regMenu}</div>
      </div>
      ${regErr?'<div class="err-text">Selecciona una opción para continuar</div>':''}
      <button class="btn primary full" data-action="next-business" style="margin-top:22px">Continuar</button>`;
  }
  function leftPlan(){
    const rows = planOpts.map(([p,m])=>`<div class="radio-row ${state.plan===p?'on':''}" data-action="pick-plan" data-v="${esc(p)}"><span class="radio ${state.plan===p?'on':''}"></span><span class="rtitle">${esc(p)}</span><span class="rmeta">${esc(m)}</span></div>`).join('');
    return `${banner}${dots()}
      <h1>Elige tu plan</h1>
      <div class="list-box radio-card plan-list">${rows}</div>
      <button class="btn primary full" data-action="next-plan" style="margin-top:26px">Continuar</button>`;
  }
  function leftEndingSuccess(){
    return `<div class="end-wrap">
      <div class="doc-illu"><div class="card"></div></div>
      <div class="end-note"><b>Menciónalo al cliente</b>
        <ol>
          <li>Ingresa a tu cuenta desde la app de Banco Plata</li>
          <li>En la pantalla principal, verás el botón <b>"Termina tu solicitud"</b>. Da clic para continuar.</li>
          <li>Finalmente, revisa y firma los documentos de apertura</li>
        </ol>
      </div>
    </div>`;
  }
  function leftEndingExists(){
    return `<div class="end-wrap">
      <div class="warn-illu">!</div>
      <div class="end-note info"><b>Información</b>
        <p>El cliente ya tiene una solicitud. Nos pondremos en contacto con él si es necesario.</p>
      </div>
    </div>`;
  }
  const leftRenderers = { ready:leftReady, employees:leftEmployees, business:leftBusiness, plan:leftPlan, endingSuccess:leftEndingSuccess, endingExists:leftEndingExists };

  // ---- right panel ----
  function ddHTML(dd, isCallback){
    const val = state.fields[dd.key];
    const open = state.openDD===dd.key;
    return `<div class="dd ${isCallback?'callback':''} ${open?'open':''}" data-dd="${dd.key}">
      <button class="dd-head" data-action="toggle-dd" data-key="${dd.key}">
        <span class="dd-label">${esc(dd.label)}</span>
        <span class="dd-value ${val?'':'placeholder'}">${val?esc(val):esc(dd.label)}</span>
        <span class="chev">▼</span>
      </button>
      <div class="dd-menu">
        ${dd.options.map(o=>`<button class="dd-opt ${val===o?'sel':''}" data-action="select-opt" data-key="${dd.key}" data-v="${esc(o)}">${esc(o)}</button>`).join('')}
      </div>
    </div>`;
  }
  function rightPanel(){
    const f = state.fields;
    const ready = f.result !== '';
    return `<h3>PyME Partnership Sales Task</h3>
      ${dropdowns.map(d=>ddHTML(d,false)).join('')}
      <div class="comment-field"><label>Comentario de Resultado</label><textarea data-field="comment" rows="1" placeholder="Comentario de Resultado">${esc(f.comment)}</textarea></div>
      <div class="rsection">Call back</div>
      <div class="dd callback" data-dd="cbDate">
        <button class="dd-head" onclick="this.querySelector('input').showPicker&&this.querySelector('input').showPicker()">
          <span class="dd-label">Date</span>
          <input type="date" data-field="cbDate" value="${esc(f.cbDate)}" style="border:0;background:none;outline:0;font-size:14.5px;color:${f.cbDate?'#161a1f':'#a9aeb8'};margin-top:1px">
        </button>
      </div>
      ${callbackDD.map(d=>ddHTML(d,true)).join('')}
      <button class="close-task ${ready?'ready':''}" data-action="close-task">Cerrar tarea</button>`;
  }

  function renderTopbar(){
    const mute=$('muteBtn'); mute.classList.toggle('muted',state.muted); mute.textContent = state.muted?'🔇':'🎙';
    $('hangBtn').classList.toggle('ended',state.callEnded);
  }
  function fmtTime(s){ const m=Math.floor(s/60), r=s%60; return `${String(m).padStart(2,'0')}:${String(r).padStart(2,'0')}`; }

  function renderOverlay(){
    let html='';
    if(state.toast) html += `<div class="toast">${esc(state.toast)}</div>`;
    if(state.modal==='done') html += `<div class="overlay" data-action="close-modal"><div class="modal" onclick="event.stopPropagation()"><div class="ic">✓</div><h2>Tarea completada</h2><p>El resultado y los datos del cliente Golden se guardaron correctamente.</p><button class="btn primary full" data-action="restart">Nueva tarea</button></div></div>`;
    if(state.modal==='ended') html += `<div class="overlay" data-action="close-modal"><div class="modal" onclick="event.stopPropagation()"><div class="ic" style="background:radial-gradient(circle at 35% 30%,#ff6b60,#e53228)">✕</div><h2>Llamada finalizada</h2><p>Selecciona un resultado en el panel derecho y cierra la tarea.</p><button class="btn primary full" data-action="close-modal">Entendido</button></div></div>`;
    $('overlayRoot').innerHTML = html;
  }
  function toast(msg){ state.toast=msg; renderOverlay(); clearTimeout(toast._t); toast._t=setTimeout(()=>{state.toast=null;renderOverlay();},1700); }

  function render(){
    const key = state.step>=steps.length ? state.ending : steps[state.step];
    $('left').innerHTML = (leftRenderers[key]||leftReady)();
    $('right').innerHTML = rightPanel();
    renderTopbar(); renderOverlay();
  }

  function goEnding(){
    state.ending = Math.random() < 0.5 ? 'endingSuccess' : 'endingExists';
    state.step = steps.length; state.openDD=null; state.openLDD=null; render();
  }

  function handle(action, el){
    switch(action){
      case 'mute': state.muted=!state.muted; return renderTopbar();
      case 'hangup': state.callEnded=true; stopTimer(); state.modal='ended'; return renderOverlay();
      case 'ready-yes': state.step=1; state.openLDD=null; return render();
      case 'pick-emp': state.employees=el.dataset.v; return render();
      case 'next-employees':
        if(!state.employees){ toast('Selecciona una opción'); return; }
        state.step=2; state.openLDD=null; return render();
      case 'toggle-ldd': state.openLDD = state.openLDD===el.dataset.key?null:el.dataset.key; return render();
      case 'pick-actividad': state.actividad=el.dataset.v; state.openLDD=null; return render();
      case 'toggle-regimen': {
        const v=el.dataset.v; const i=state.regimen.indexOf(v);
        if(i>=0) state.regimen.splice(i,1); else state.regimen.push(v);
        return render();
      }
      case 'remove-regimen': { const i=state.regimen.indexOf(el.dataset.v); if(i>=0) state.regimen.splice(i,1); return render(); }
      case 'next-business':
        if(!state.actividad || state.regimen.length===0){ state.showErr=true; return render(); }
        state.showErr=false; state.step=3; state.openLDD=null; return render();
      case 'pick-plan': state.plan=el.dataset.v; return render();
      case 'next-plan':
        if(!state.plan){ toast('Selecciona un plan'); return; }
        return goEnding();
      case 'toggle-dd': state.openDD = state.openDD===el.dataset.key?null:el.dataset.key; return render();
      case 'select-opt': state.fields[el.dataset.key]=el.dataset.v; state.openDD=null; return render();
      case 'close-task':
        if(!state.fields.result){ toast('Selecciona un resultado antes de cerrar'); return; }
        state.modal='done'; return renderOverlay();
      case 'close-modal': state.modal=null; return renderOverlay();
      case 'restart': return restart();
      default: return;
    }
  }
  function restart(){
    state.step=0; state.openDD=null; state.openLDD=null; state.modal=null; state.callEnded=false; state.muted=false;
    state.seconds=0; state.employees=''; state.actividad=''; state.regimen=[]; state.plan='Mensual Emprendedor';
    state.showErr=false; state.ending=null;
    state.fields={partner:'',entity:'',relation:'',companies:'',employees:'',decision:'',result:'',comment:'',cbDate:'',cbFrom:'',cbUntil:''};
    startTimer(); render();
  }

  let timerId=null;
  function startTimer(){ stopTimer(); timerId=setInterval(()=>{ if(!state.callEnded){ state.seconds++; $('timer').textContent=fmtTime(state.seconds);} },1000); }
  function stopTimer(){ if(timerId) clearInterval(timerId); timerId=null; }

  document.addEventListener('click', e=>{
    const el=e.target.closest('[data-action]');
    if(!el){
      if(state.openDD && !e.target.closest('.dd-menu') && !e.target.closest('.dd-head')){ state.openDD=null; render(); }
      if(state.openLDD && !e.target.closest('.ldd-menu') && !e.target.closest('.ldd-head')){ state.openLDD=null; render(); }
      return;
    }
    e.preventDefault(); e.stopPropagation();
    handle(el.dataset.action, el);
  });
  document.addEventListener('input', e=>{
    const f=e.target.dataset.field; if(!f) return;
    if(f in state.fields) state.fields[f]=e.target.value;
    if(f==='cbDate') e.target.style.color = e.target.value ? '#161a1f' : '#a9aeb8';
    if(f==='comment'){ e.target.style.height='auto'; e.target.style.height=e.target.scrollHeight+'px'; }
  });

  startTimer();
  render();
})();
</script>
</body>
</html>
