<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulador · Solicitud Cuenta Empresa (CRM)</title>
<meta name="sim:category" content="CRM">
<meta name="sim:title" content="Solicitud Cuenta Empresa (CRM)">
<meta name="sim:description" content="Alta y seguimiento de la solicitud de Cuenta Empresa en CRM.">
<style>
:root{
  --nar:#ff5d15;
  --neg:#1D2026;
  --gri:#efeff8;
  --bla:#ffffff;
  --ok:#1f9d55;
  --wa:#c98a00;
  --ba:#d93025;
  --r:14px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{
  font-family:Poppins,"Poppins",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:var(--neg);background:var(--gri);font-size:15px;line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit}
.app{height:100%;display:flex;flex-direction:column;min-height:0}

/* ---------- top bar ---------- */
.top{
  flex:0 0 auto;display:flex;align-items:center;gap:14px;overflow:hidden;
  padding:10px 20px;background:var(--bla);border-bottom:1px solid rgba(29,32,38,.10);
}
.brand,.prog,.tbtn{flex:0 0 auto}
.brand{font-weight:700;font-size:15px;letter-spacing:-.01em}
.brand span{color:var(--nar)}
.prog{font-size:13px;font-weight:600;color:rgba(29,32,38,.55);white-space:nowrap}
.bar{flex:1;height:6px;background:var(--gri);border-radius:99px;overflow:hidden;min-width:60px;max-width:420px}
.bar i{display:block;height:100%;background:var(--nar);border-radius:99px;transition:width .25s}
.top .sp{flex:1}
.tbtn{
  border:1px solid rgba(29,32,38,.18);background:var(--bla);color:var(--neg);
  border-radius:10px;padding:7px 13px;font-size:13px;font-weight:600;cursor:pointer;
}
.tbtn:hover{border-color:var(--neg)}
.tbtn[disabled]{opacity:.35;cursor:not-allowed}
.esc{font-size:11px;color:rgba(29,32,38,.45);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.libre{display:flex;align-items:center;gap:6px}
.libre select{
  font-family:inherit;font-size:12px;border:1px solid rgba(29,32,38,.18);
  border-radius:8px;padding:5px 7px;background:var(--bla);color:var(--neg);max-width:200px;
}

/* ---------- split ---------- */
.main{flex:1;display:flex;min-height:0}
.left{width:60%;min-width:0;overflow-y:auto;padding:22px 26px 60px}
.right{width:40%;min-width:0;overflow-y:auto;background:var(--neg);color:var(--bla);padding:20px 22px 60px}
.left::-webkit-scrollbar,.right::-webkit-scrollbar{width:9px}
.left::-webkit-scrollbar-thumb{background:rgba(29,32,38,.18);border-radius:9px}
.right::-webkit-scrollbar-thumb{background:rgba(255,255,255,.22);border-radius:9px}

/* ---------- CRM form ---------- */
.crm{max-width:620px;margin:0 auto}
.card{background:var(--bla);border-radius:var(--r);padding:22px;box-shadow:0 1px 3px rgba(29,32,38,.10);margin-bottom:14px}
.h1{font-size:21px;font-weight:700;margin:0 0 4px;letter-spacing:-.01em}
.h2{font-size:16px;font-weight:700;margin:0 0 10px}
.q{font-size:15px;font-weight:600;margin:10px 0 14px}
.hint{font-size:13px;color:rgba(29,32,38,.60);margin:0 0 12px}
.f{margin-bottom:14px}
.f>label{display:block;font-size:13px;font-weight:600;color:rgba(29,32,38,.70);margin-bottom:5px}
.inp,select.inp{
  width:100%;font-family:inherit;font-size:15px;color:var(--neg);
  background:var(--gri);border:1px solid rgba(29,32,38,.12);border-radius:10px;padding:11px 13px;
}
.inp:focus{outline:none;border-color:var(--nar);box-shadow:0 0 0 3px rgba(255,93,21,.16);background:var(--bla)}
.inp[readonly]{background:#e6e6f0;color:rgba(29,32,38,.75);cursor:not-allowed}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}
.money{position:relative}
.money .inp{padding-left:28px}
.money b{position:absolute;left:12px;top:11px;font-weight:600;color:rgba(29,32,38,.55)}
.btn{
  border:0;background:var(--nar);color:var(--bla);border-radius:12px;
  padding:13px 20px;font-size:15px;font-weight:600;cursor:pointer;width:100%;
}
.btn:hover{filter:brightness(1.06)}
.btn[disabled]{background:rgba(29,32,38,.16);color:rgba(29,32,38,.45);cursor:not-allowed;filter:none}
.btn.gh{background:var(--bla);color:var(--neg);border:1px solid rgba(29,32,38,.20)}
.btn.gh:hover{border-color:var(--neg);filter:none}
.btn.sm{width:auto;padding:9px 15px;font-size:14px}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btns .btn{width:auto;flex:1;min-width:150px}
.err{color:var(--ba);font-size:14px;font-weight:600;margin:10px 0 0;display:flex;gap:6px;align-items:flex-start}
.warn{color:var(--wa);font-size:14px;font-weight:600;margin:10px 0 0}
.okmsg{color:var(--ok);font-size:15px;font-weight:600;margin:12px 0 0}
.link{background:none;border:0;color:var(--nar);font-size:14px;font-weight:600;cursor:pointer;padding:0;text-decoration:underline}
.link[disabled]{color:rgba(29,32,38,.40);text-decoration:none;cursor:default}
.links{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px}

/* mención block inside CRM */
.men{background:rgba(255,93,21,.07);border-left:3px solid var(--nar);border-radius:0 10px 10px 0;padding:14px 16px;margin:0 0 12px}
.men .t{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--nar);margin-bottom:7px}
.men p{margin:0;font-size:15px;font-weight:600;line-height:1.5}
.conf{display:flex;align-items:center;gap:10px;margin:0 0 14px;flex-wrap:wrap}
.conf .st{font-size:13px;font-weight:600;color:var(--ok)}
.chk{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-size:15px;font-weight:600;margin:14px 0}
.chk input{width:19px;height:19px;margin:1px 0 0;accent-color:var(--nar);cursor:pointer;flex:0 0 auto}
.opt{display:flex;gap:10px;align-items:center;cursor:pointer;font-size:15px;background:var(--gri);border:1px solid rgba(29,32,38,.12);border-radius:10px;padding:11px 13px;margin-bottom:8px}
.opt input{accent-color:var(--nar);width:18px;height:18px;cursor:pointer}
.opt.on{border-color:var(--nar);background:rgba(255,93,21,.07)}

/* autocompletado de Actividad del negocio */
.ac{position:relative}
.sug{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:20;background:var(--bla);
  border:1px solid rgba(29,32,38,.14);border-radius:10px;box-shadow:0 8px 24px rgba(29,32,38,.16);
  max-height:230px;overflow-y:auto;padding:4px}
.sug button{display:block;width:100%;text-align:left;background:none;border:0;font-family:inherit;
  font-size:14.5px;color:var(--neg);padding:9px 10px;border-radius:8px;cursor:pointer;line-height:1.35}
.sug button:hover{background:var(--gri)}
.sug button b{color:var(--nar)}
.sug button small{display:block;font-size:12.5px;color:rgba(29,32,38,.55);margin-top:2px;font-weight:400}
.sug .grupo{padding:9px 10px 4px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:rgba(29,32,38,.45)}
.sug .vacio{padding:9px 10px;font-size:14px;color:rgba(29,32,38,.55)}
.sug .pista{padding:7px 10px;font-size:12px;color:rgba(29,32,38,.45);border-top:1px solid rgba(29,32,38,.08);margin-top:2px}

/* cabecera CRM de las pantallas de entrega */
.crmhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 0 14px;font-size:14px;font-weight:700}
.crmhead .who{color:var(--neg)}
/* bloque ToDo: marcador de la propia CRM (texto en inglés, sin traducir) */
.todo{background:rgba(201,138,0,.10);border-left:3px solid var(--wa);border-radius:0 10px 10px 0;padding:12px 14px;margin:0 0 14px}
.todo .t{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--wa);margin-bottom:6px}
.todo p{margin:0;font-size:14px;line-height:1.45;color:rgba(29,32,38,.78)}
.mapzoom{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:4px}
.mapzoom button{width:26px;height:26px;border-radius:7px;border:1px solid rgba(29,32,38,.14);background:var(--bla);font-size:15px;font-weight:700;line-height:1;cursor:pointer;color:var(--neg);font-family:inherit}
.mapbtn{position:absolute;left:50%;bottom:10px;transform:translateX(-50%)}

/* map / address */
.map{height:150px;border-radius:12px;background:
  repeating-linear-gradient(0deg,#e4e4ef 0 1px,transparent 1px 26px),
  repeating-linear-gradient(90deg,#e4e4ef 0 1px,transparent 1px 26px),#f6f6fb;
  border:1px solid rgba(29,32,38,.12);position:relative;margin-bottom:12px;overflow:hidden}
.map .pin{position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:var(--nar);box-shadow:0 0 0 6px rgba(255,93,21,.22)}
.addr{width:100%;text-align:left;background:var(--gri);border:1px solid rgba(29,32,38,.12);border-radius:10px;padding:12px 13px;font-size:15px;font-family:inherit;cursor:pointer;margin-bottom:8px;color:var(--neg)}
.addr:hover{border-color:var(--nar)}
.addr.on{border-color:var(--nar);background:rgba(255,93,21,.07)}
.addr small{display:block;font-size:12px;color:rgba(29,32,38,.55);margin-top:2px}

/* slots */
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0 12px}
.slots .d{font-size:12px;font-weight:700;text-align:center;padding:7px 2px;background:var(--gri);border-radius:8px}
.slot{font-family:inherit;font-size:12.5px;font-weight:600;padding:9px 2px;border-radius:8px;border:1px solid rgba(29,32,38,.14);background:var(--bla);cursor:pointer;color:var(--neg)}
.slot:hover{border-color:var(--nar)}
.slot.on{background:var(--nar);border-color:var(--nar);color:var(--bla)}

/* plans */
.plan{display:flex;align-items:center;gap:12px;border:1px solid rgba(29,32,38,.14);border-radius:12px;padding:14px;margin-bottom:9px;cursor:pointer;background:var(--bla)}
.plan.on{border-color:var(--nar);box-shadow:0 0 0 2px rgba(255,93,21,.18)}
.plan input{accent-color:var(--nar);width:18px;height:18px;cursor:pointer}
.plan .n{font-weight:700;font-size:16px;flex:1}
.plan .p{font-weight:700;font-size:16px;color:var(--nar);white-space:nowrap}
.promo{font-size:13px;font-weight:600;color:var(--nar);background:rgba(255,93,21,.09);border-radius:8px;padding:8px 11px;margin:-4px 0 9px}

/* summary card screen 9 */
.dcard{border:1px solid rgba(29,32,38,.14);border-radius:12px;padding:16px;margin-bottom:14px}
.dcard .big{font-size:18px;font-weight:700;margin-bottom:12px}
.dl{display:flex;gap:10px;font-size:14px;padding:7px 0;border-top:1px solid rgba(29,32,38,.08)}
.dl b{flex:0 0 128px;color:rgba(29,32,38,.60);font-weight:600}

/* spinner */
.spin{width:34px;height:34px;border-radius:50%;border:3px solid rgba(29,32,38,.14);border-top-color:var(--nar);animation:sp 1s linear infinite;margin:6px auto 16px}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- prompter panel ---------- */
.pt{font-size:11px;font-weight:700;letter-spacing:.10em;text-transform:uppercase;color:rgba(255,255,255,.50);margin:0 0 8px}
.pnum{font-size:19px;font-weight:700;margin:0 0 16px;letter-spacing:-.01em}
.pb{margin-bottom:20px}
.pb h3{font-size:11px;font-weight:700;letter-spacing:.10em;text-transform:uppercase;color:rgba(255,255,255,.50);margin:0 0 8px}
.pb .body{font-size:16px;line-height:1.52;color:rgba(255,255,255,.92)}
.pb .body p{margin:0 0 10px}
.pb .body p:last-child{margin-bottom:0}
.pb .body b{color:var(--bla)}
.pb code{background:rgba(255,255,255,.13);border-radius:5px;padding:1px 6px;font-family:inherit;font-size:14.5px;font-weight:600;white-space:nowrap}
.say{background:rgba(255,255,255,.07);border-left:3px solid var(--nar);border-radius:0 10px 10px 0;padding:14px 15px;font-size:16px;line-height:1.5}
.say.words{border-left-color:rgba(255,255,255,.35)}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:99px;padding:5px 11px;margin-bottom:9px}
.badge.lit{background:var(--nar);color:var(--bla)}
.badge.wor{background:transparent;color:var(--bla);border:1.5px dashed rgba(255,255,255,.65)}
.cli{background:rgba(255,255,255,.07);border-radius:10px;padding:13px 15px;font-size:16px;line-height:1.5;margin-bottom:8px}
.cli:last-child{margin-bottom:0}
.pb ul{margin:0;padding-left:19px}
.pb li{margin-bottom:9px;font-size:16px;line-height:1.5}
.pb li:last-child{margin-bottom:0}
.pb ol{margin:0;padding-left:21px}
details.fold{background:rgba(255,255,255,.06);border-radius:12px;padding:0;margin-bottom:14px;border:1px solid rgba(255,255,255,.12)}
details.fold>summary{
  cursor:pointer;list-style:none;padding:13px 15px;font-size:14.5px;font-weight:700;
  display:flex;align-items:center;gap:9px;color:var(--bla);
}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::before{content:"›";font-size:20px;line-height:1;transform:rotate(0);transition:transform .15s;color:var(--nar)}
details.fold[open]>summary::before{transform:rotate(90deg)}
details.fold .in{padding:0 15px 15px;color:var(--bla)}
.pbtn{
  border:0;background:var(--nar);color:var(--bla);border-radius:10px;padding:11px 16px;
  font-size:14.5px;font-weight:700;cursor:pointer;margin-top:11px;
}
.pbtn.done{background:rgba(255,255,255,.14);cursor:default}
.pbtn.gh{background:transparent;color:var(--bla);border:1px solid rgba(255,255,255,.35)}
.note{font-size:14px;line-height:1.45;color:rgba(255,255,255,.62);border-top:1px solid rgba(255,255,255,.14);padding-top:12px;margin-top:4px}
.cmp{width:100%;border-collapse:collapse;font-size:13.5px}
.cmp th,.cmp td{border-bottom:1px solid rgba(255,255,255,.13);padding:7px 6px;text-align:left;vertical-align:top;color:var(--bla)}
.cmp th{font-weight:700;color:var(--bla)}
.cmp td:first-child{color:rgba(255,255,255,.78);font-weight:600}
.cmp b{color:var(--nar)}
.alert{background:rgba(255,93,21,.16);border-radius:10px;padding:11px 13px;font-size:14.5px;font-weight:600;margin-top:10px;color:var(--bla)}
.qz{display:block;width:100%;text-align:left;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.22);
  border-radius:10px;padding:13px 15px;font-size:15.5px;line-height:1.45;color:var(--bla);font-family:inherit;cursor:pointer;margin-bottom:9px}
.qz:hover{border-color:var(--nar)}
.qz.bad{border-color:var(--ba);background:rgba(217,48,37,.16)}
.qz.good{border-color:var(--ok);background:rgba(31,157,85,.18)}

/* ---------- start / summary screens ---------- */
.center{max-width:760px;margin:0 auto;padding:14px 0}
.pick{display:block;width:100%;text-align:left;background:var(--bla);border:1px solid rgba(29,32,38,.14);
  border-radius:var(--r);padding:17px 19px;margin-bottom:11px;cursor:pointer;font-family:inherit;color:var(--neg)}
.pick:hover{border-color:var(--nar);box-shadow:0 2px 10px rgba(29,32,38,.10)}
.pick .n{font-size:16px;font-weight:700;margin-bottom:3px}
.pick .d{font-size:14px;color:rgba(29,32,38,.62)}
.chk-row{display:flex;gap:12px;align-items:flex-start;background:var(--bla);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.chk-row .ic{font-size:17px;line-height:1.2;flex:0 0 auto}
.chk-row .tx{flex:1}
.chk-row .tx b{display:block;font-size:15px;margin-bottom:2px}
.chk-row .tx span{font-size:14px;color:rgba(29,32,38,.62)}

/* ---------- toast ---------- */
.toast{
  position:fixed;left:50%;top:16px;transform:translateX(-50%);
  background:var(--neg);color:var(--bla);border-radius:12px;padding:12px 18px;
  font-size:14.5px;font-weight:600;box-shadow:0 8px 24px rgba(29,32,38,.28);z-index:50;max-width:70%;
}
.mask{position:fixed;inset:0;background:rgba(29,32,38,.55);display:flex;align-items:center;justify-content:center;z-index:60;padding:20px}
.modal{background:var(--bla);border-radius:var(--r);padding:24px;max-width:420px;width:100%}
.modal p{margin:0 0 18px;font-size:15px;font-weight:600}

@media (max-width:1240px){
  .bar{display:none}
  .top{gap:10px;padding:9px 14px}
}
@media (max-width:1180px){
  .left{padding:18px 18px 60px}
  .right{padding:16px 16px 60px}
  .pb .body,.pb li,.say,.cli{font-size:16px}
  .slots{gap:6px}
}
</style>
</head>

function go(p,sinHistoria){
  if(!sinHistoria && S.pant) S.hist.push(S.pant);
  S.pant=p; S.err="";
  if(NUM[p]) S.num=NUM[p];
  limpiarTimers();
  if(p==="2"){ S.reenvio=25; tReenvio=setInterval(tick,1000); }
  if(p==="6"){ S.revListo=false; tRevision=setTimeout(revisionLista,3500); }
  if(p==="9"){ S.llegoEntrega=true; }
  render();
}
function tick(){ if(S.reenvio>0){ S.reenvio--; render(); } else { clearInterval(tReenvio); tReenvio=null; } }
function revisionLista(){ S.revListo=true; salirRevision(); }
function salirRevision(){
  if(esc().scoring==="rechazo") go("rechazo"); else go("7");
}
function atras(){
  if(!S.hist.length) return;
  const p=S.hist.pop();
  S.pant=p; S.err=""; S.zonaErr=false;
  if(NUM[p]) S.num=NUM[p];
  limpiarTimers();
  if(p==="2"){ S.reenvio=0; }
  if(p==="6"){ S.revListo=true; }
  render();
}
function iniciar(id){
  limpiarTimers();

  go("1",true);

/* =======================================================================
   UTILIDADES
   ======================================================================= */
function v(k){ return S.campos[k]||""; }
function set(k,val){ S.campos[k]=val; }
function digitos(s){ return (s||"").replace(/\D/g,""); }
function ult4(){ const d=digitos(v("tel")); return d.slice(-4)||"0000"; }
function esc_(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

function sinAcentos(x){
  return (x||"").normalize?(x||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase():(x||"").toLowerCase();
}
function catalogo(k){
  if(k==="regimen") return F.p5.regimenOpc.map(function(o){ return {n:o.n,d:o.d,g:""}; });
  const out=[];
  F.p5.actividadGrupos.forEach(function(gr){
    gr.items.forEach(function(x){ out.push({n:x,d:"",g:gr.t}); });
  });
  return out;
}
function sugerencias(k,q){
  const t=sinAcentos(q).trim();
  const lista=catalogo(k);
  if(t.length<3) return lista.slice(0);            /* lista completa al abrir */
  const pos=function(o){
    const a=sinAcentos(o.n).indexOf(t), b=sinAcentos(o.d).indexOf(t);
    if(a===0) return 0;                            /* empieza por el nombre */
    if(a>0) return 1;                              /* dentro del nombre */
    if(b>=0) return 2;                             /* en la descripción */
    return -1;
  };
  return lista.filter(function(o){ return pos(o)>=0; })
              .sort(function(x,y){ return pos(x)-pos(y); })
              .slice(0,10);
}
function resaltar(opcion,q){
  const t=sinAcentos(q).trim();
  const i=sinAcentos(opcion).indexOf(t);
  if(i<0||!t) return esc_(opcion);
  return esc_(opcion.slice(0,i))+"<b>"+esc_(opcion.slice(i,i+t.length))+"</b>"+esc_(opcion.slice(i+t.length));
}

function generarRFC(){
  const n=v("nombres").trim(), a1=v("ap1").trim(), a2=v("ap2").trim();
  const sinAcento=function(s){return s.normalize?s.normalize("NFD").replace(/[\u0300-\u036f]/g,""):s;};
  const A1=sinAcento(a1).toUpperCase(), A2=sinAcento(a2).toUpperCase(), N=sinAcento(n).toUpperCase();
  const vocal=(A1.slice(1).match(/[AEIOU]/)||["X"])[0];
  /* Sin segundo apellido el SAT usa las dos primeras letras del nombre */
  const letras = A2
    ? (A1[0]||"X")+vocal+A2[0]+(N[0]||"X")
    : (A1[0]||"X")+vocal+(N[0]||"X")+(N[1]||"X");
  const fecha=digitos(v("fa")).slice(-2)+digitos(v("fm")).padStart(2,"0").slice(-2)+digitos(v("fd")).padStart(2,"0").slice(-2);
  let homo=esc().homoclave;
  if(!homo){
    const base=letras+fecha; let h=0;
    for(let i=0;i<base.length;i++) h=(h*31+base.charCodeAt(i))%9973;
    const AB="ABCDEFGHIJKLMNPQRSTUVWXYZ";
    homo=AB[h%25]+String(h%10)+AB[(h*7)%25];
  }
  return letras+fecha+homo;
}
/* Segundo apellido NO es obligatorio */
function datosPersonalesListos(){ return v("nombres")&&v("ap1")&&digitos(v("fd"))&&digitos(v("fm"))&&digitos(v("fa")).length>=4; }
function direccionTexto(){
  const c=S.campos;
  if(c.calle||c.colonia||c.cp){
    let t=(c.calle||"")+(c.num?" "+c.num:"");
    if(c.colonia) t+=(t?", ":"")+"Col. "+c.colonia;
    if(c.ciudad) t+=(t?", ":"")+c.ciudad;
    if(c.cp) t+=(t?", ":"")+"C.P. "+c.cp;
    return t;
  }
  return esc().domicilioTexto||"—";
}
function ventanaPartes(){
  const p=(v("vent")||"").split("–");
  return {v1:(p[0]||"").trim(), v2:(p[1]||"").trim()};
}
function fechaLarga(){
  const e=esc();
  if(S.entrega==="embajador"){
    if(e.slot && e.slot.dia===v("dia")) return e.slot.fechaLarga;
    const d=(v("dia")||"").replace(/,.*$/,"");
    return d.replace(" de jun"," de junio")||"—";
  }
  return (e.fechaPostal&&e.fechaPostal.larga)||"—";
}
function guionFinal(){
  const e=esc(), d=direccionTexto(), w=ventanaPartes();
  const rep=function(t){
    return t.replace("{PREAPROBACION}",FRASE_PREAPROBACION)
            .replace("{fecha}",fechaLarga()).replace("{v1}",w.v1||"__").replace("{v2}",w.v2||"__")
            .replace("{dir}",d)
            .replace("{dia}",(e.fechaPostal&&e.fechaPostal.dia)||"__")
            .replace("{mes}",(e.fechaPostal&&e.fechaPostal.mes)||"__")
            .replace("{anio}",(e.fechaPostal&&e.fechaPostal.anio)||"__");
  };
  return (S.entrega==="embajador"?F.p9.guionEmb:F.p9.guionPost).map(rep);
}
function tiempoTexto(){
  const ms=(S.tFin||Date.now())-(S.t0||Date.now());
  const s=Math.max(0,Math.round(ms/1000));
  const m=Math.floor(s/60);
  return m+" min "+String(s%60).padStart(2,"0")+" s";
}

function render(){
  const a=document.activeElement;
  const fk=(a&&a.dataset&&a.dataset.k)?a.dataset.k:null;
  let pos=null;
  try{ pos=(a&&a.selectionStart!=null)?a.selectionStart:null; }catch(e){}
  app.innerHTML=view();
  if(fk){
    const el=app.querySelector('[data-k="'+fk+'"]');
    if(el){ el.focus(); if(pos!=null){ try{ el.setSelectionRange(pos,pos); }catch(e){} } }
  }
}

function view(){
  if(S.pant==="inicio") return topbar()+'<div class="main"><div class="left" style="width:100%">'+inicioHTML()+"</div></div>"+overlays();
  if(S.pant==="resumen") return topbar()+'<div class="main"><div class="left" style="width:100%">'+resumenHTML()+"</div></div>"+overlays();
  return topbar()+'<div class="main"><div class="left">'+formHTML()+'</div><div class="right">'+panelHTML()+"</div></div>"+overlays();
}

       '<option value="">—</option>'+

function overlays(){

/* =======================================================================
   PANEL APUNTADOR
   ======================================================================= */
const TITULOS = {
  "1":F.p1.titulo,"2":F.p2.titulo,"3":F.p3.titulo,"4":F.p4.titulo,"5":F.p5.titulo,
  "6":F.p6.titulo,"7":F.p7.titulo,"7a":F.p7a.titulo,"7b":F.p7b.titulo,"8":F.p8.titulo,"9":F.p9.titulo,
  "corner":C.errores.corner.titulo,"tecnico":C.errores.tecnico.titulo,"rechazo":C.errores.rechazo.titulo,
  "sindoc":C.errores.sindoc.titulo,"noAutoriza":C.errores.noAutoriza.titulo
};
function panelKey(){
  if(S.pant==="2"&&S.otpAgotado) return "paro";
  if(PARO.indexOf(S.pant)>=0) return "paro";
  if(S.pant==="7"&&S.zonaErr) return "zona";
  return "p"+S.pant;
}
function bloque(titulo,cuerpo){ return '<div class="pb"><h3>'+titulo+'</h3><div class="body">'+cuerpo+"</div></div>"; }
function badge(modo){ return '<div><span class="badge '+(modo==="lit"?"lit":"wor")+'">'+(modo==="lit"?C.ui.badgeLit:C.ui.badgeWor)+"</span></div>"; }
function lista(items){ return "<ul>"+items.map(function(i){return "<li>"+i+"</li>";}).join("")+"</ul>"; }

function panelHTML(){
  const k=panelKey(), d=P[k]||P.paro, e=esc();
  let h='<div class="pt">'+(S.pant==="2"&&S.otpAgotado?C.errores.otpAgotado.titulo:(TITULOS[S.pant]||""))+"</div>";
  h+='<div class="pnum">'+(NUM[S.pant]&&k!=="paro"?C.ui.progreso.replace("{n}",NUM[S.pant]):"Cierre de la llamada")+"</div>";

  /* 1 · Qué le dices */
  let dice=badge(d.modo)+'<div class="say'+(d.modo==="lit"?"":" words")+'">'+(d.dice||"")+"</div>";
  if(d.diceWor) dice+='<div style="margin-top:12px">'+badge("wor")+'<div class="say words">'+d.diceWor+"</div></div>";
  if(k==="p9") dice+='<div class="say" style="margin-top:12px">'+guionFinal().map(function(p){return "<p style=\'margin:0 0 10px\'>"+p+"</p>";}).join("")+"</div>";
  if(k==="paro"&&S.pant!=="2") dice+='<div class="say" style="margin-top:12px">'+(C.errores[S.pant]?C.errores[S.pant].texto:"")+"</div>";
  h+=bloque(C.ui.bloques[0],dice);

  /* 2 · Qué te contesta */
  let resp=null;
  if(d.contesta) resp=d.contesta[S.esc]||d.contesta.A;
  if(k==="paro"&&S.pant==="rechazo"&&S.esc==="C") resp=null;
  if(resp) h+=bloque(C.ui.bloques[1],resp.map(function(r){return '<div class="cli">'+r+"</div>";}).join(""));

  /* extras de la pantalla 8 */
  if(k==="p8"){
    let ex="";
    const orden=["Independiente","Emprendedor","Empresario"];
    orden.forEach(function(n){
      const g=C.planesGuion[n];
      const abierto=(e.plan===n)?" open":"";
      ex+='<details class="fold"'+abierto+'><summary>Ver guion completo · '+g.titulo+'</summary><div class="in"><div class="say words">'+g.texto+"</div></div></details>";
    });
    ex+='<details class="fold"><summary>'+C.comparativa.titulo+'</summary><div class="in">'+
        '<div class="alert">'+C.comparativa.aviso+"</div>"+
        '<div style="overflow-x:auto"><table class="cmp"><tr>'+C.comparativa.cols.map(function(c){return "<th>"+c+"</th>";}).join("")+"</tr>"+
        C.comparativa.filas.map(function(f){return "<tr>"+f.map(function(c){return "<td>"+c+"</td>";}).join("")+"</tr>";}).join("")+
        "</table></div>"+
        C.comparativa.pie.map(function(p){return '<div class="note" style="border:0;padding-top:10px;margin:0">'+p+"</div>";}).join("")+
        "</div></details>";
    h+='<div class="pb">'+ex+"</div>";
  }

  /* 3 · Qué haces en la pantalla */
  let haces = d.hacesLista ? "<ol>"+d.hacesLista.map(function(i){return "<li>"+i+"</li>";}).join("")+"</ol>" : "<p>"+(d.haces||"")+"</p>";
  h+=bloque(C.ui.bloques[2],haces);

  /* quiz del escenario C */
  if(S.pant==="rechazo"&&S.esc==="C"){
    let q='<div class="cli">'+C.quiz.pregunta+'</div><p style="margin:10px 0">'+C.quiz.intro+"</p>";
    C.quiz.opciones.forEach(function(o,i){
      const cl=(S.quizEstado==="ok"&&o.ok)?" good":((S.quizEstado==="mal"&&!o.ok)?" bad":"");
      q+='<button class="qz'+cl+'" data-act="quiz" data-v="'+i+'">'+o.t+"</button>";
    });
    if(S.quizEstado==="ok") q+='<div class="alert">'+C.quiz.opciones[0].fb+"</div>";
    if(S.quizEstado==="mal") q+='<div class="alert">'+C.quiz.opciones[1].fb+"</div>";
    h+=bloque("Qué le contestas",q);
  }

  /* nota del paro */
  if(k==="paro"&&d.ojo) h+='<div class="pb"><div class="body"><div class="alert">'+d.ojo+"</div></div></div>";

  /* 4 · Si algo se sale del guion — plegado por defecto */
  if(d.fuera&&d.fuera.length){
    h+='<details class="fold"><summary>'+C.ui.bloques[3]+'</summary><div class="in"><div class="body">'+lista(d.fuera)+"</div></div></details>";
  }

  /* salida al resumen */
  if(S.pant==="9"||(k==="paro"&&puedeResumen())){
    h+='<button class="pbtn gh" data-act="resumen">'+C.ui.verResumen+"</button>";
  }
  return h;
}

function resumenHTML(){
  const R=C.resumen, it=R.items;
  const filas=[
    {ok:!!S.consent, t:it.consent.t, tx:S.consent?it.consent.ok:it.consent.no},
    {ok:S.rfcManual===0, t:it.rfc.t, tx:S.rfcManual===0?it.rfc.ok:it.rfc.no.replace("{n}",S.rfcManual)},
    {ok:(v("detalles").trim().length>=20), t:it.detalles.t, tx:(v("detalles").trim().length>=20)?it.detalles.ok:it.detalles.no},
    {ok:!!S.llegoEntrega, t:it.entrega.t, tx:S.llegoEntrega?it.entrega.ok:it.entrega.no},
    {info:true, t:it.tiempo.t, tx:it.tiempo.ok.replace("{t}",tiempoTexto())}
  ];
  let h='<div class="center"><div class="card"><div class="h1">'+R.titulo+'</div><p class="hint" style="font-size:15px">'+R.intro+"</p></div>";
  filas.forEach(function(f){
    h+='<div class="chk-row"><div class="ic">'+(f.info?"🟡":(f.ok?"🟢":"🔴"))+'</div><div class="tx"><b>'+f.t+"</b><span>"+f.tx+"</span></div></div>";
  });
  h+='<div class="btns" style="margin-top:16px"><button class="btn" data-act="repetir">'+R.repetir+"</button>"+
     '<button class="btn gh" data-act="otro">'+R.otro+"</button></div></div>";
  return h;
}

/* =======================================================================
   EVENTOS
   ======================================================================= */
function fijarEntrega(tipo){
  S.entrega=tipo||"embajador";
  go(S.entrega==="paqueteria"?"7a":"7b");
}
function llenarDomicilio(o){
  if(!o) return;
  set("cp",o.cp||""); set("ciudad",o.ciudad||""); set("colonia",o.colonia||"");
  set("calle",o.calle||""); set("num",o.num||"");
}

app.addEventListener("click",function(ev){
  const t=ev.target.closest("[data-act]");
  /* clic fuera del autocompletado: se cierra */
  if(S.sugCampo && !ev.target.closest(".ac")){ S.sugCampo=null; if(!t) return render(); }
  if(!t) return;
  const act=t.dataset.act, val=t.dataset.v, e=esc();

  switch(act){
  case "iniciar": iniciar(val); return;
  case "atras": atras(); return;
  case "pedirReinicio": S.modal={texto:C.ui.reiniciarPreg,accion:"reinicio"}; render(); return;
  case "modalNo": S.modal=null; render(); return;
  case "modalSi": {
    const m=S.modal; S.modal=null;
    if(!m) return render();
    if(m.accion==="reinicio") return iniciar(S.esc);
    if(m.accion==="editar"){ S.zonaErr=false; return go("7"); }
    if(m.accion==="cancelarEntrega"){ set("dia","");set("vent",""); S.zonaErr=false; return go("7"); }
    if(m.accion==="cancelarSolicitud") return go("corner");
    render(); return;
  }
  case "zoom": return;   /* el mapa es decorativo, como en la maqueta */

  case "sug": set(t.dataset.c,val); S.sugCampo=null; S.err=""; render(); return;

  case "verificar": S.otpIntentos=0; S.otpOk=false; S.otpAgotado=false; S.otpErr=""; set("codigo",""); return go("2");
  case "cambiarNumero": return go("1");
  case "reenviar": S.reenvio=25; clearInterval(tReenvio); tReenvio=setInterval(tick,1000); toast("Código reenviado por SMS y WhatsApp."); return;

  case "consent": S.consent=!S.consent; S.err=""; render(); return;
  case "contConsent":
    if(!S.consent){ S.err=F.p3.error; return render(); }
    return go("4");
  case "noAutoriza": return go("noAutoriza");

  case "generarRFC":
    if(!datosPersonalesListos()){ S.err=F.p4.rfcFalta; return render(); }
    set("rfc",generarRFC()); S.err=""; render(); return;
  case "contPersonales": return go("5");

  case "doc": set("doc",val); S.err=""; render(); return;
  case "contNegocio":
    if(!v("doc")){ S.err=F.p5.error; return render(); }
    if(v("doc")==="Ninguna de las anteriores") return go("sindoc");
    return go("6");

  case "elegirGuardado": {
    const g=e.guardados[Number(val)];
    S.addrSel=Number(val);
    if(!g.zona){ S.zonaErr=true; return render(); }
    S.zonaErr=false; llenarDomicilio(g.campos||e.domicilio);
    return fijarEntrega(e.entrega);
  }
  case "elegirUbicacion":
    S.zonaErr=false; llenarDomicilio(e.domicilio);
    return fijarEntrega(e.entrega);

  case "slot": {
    const p=val.split("|"); set("dia",p[0]); set("vent",p[1]); S.err=""; render(); return;
  }
  case "otroDia": set("dia",""); set("vent",""); toast(F.p7b.otroDiaAviso); return;
  case "contEntrega":
    if(S.entrega==="embajador"&&(!v("dia")||!v("vent"))){ S.err=F.p7b.faltaSlot; return render(); }
    S.err=""; return go("8");

  case "plan": set("plan",val); S.err=""; render(); return;
  case "contPlan":
    if(!v("plan")){ S.err=F.p8.error; return render(); }
    return go("9");

  case "editarEntrega": S.modal={texto:F.p9.confEditar,accion:"editar"}; render(); return;
  case "cancelarEntrega": S.modal={texto:F.p9.confCancelarEntrega,accion:"cancelarEntrega"}; render(); return;
  case "cancelarSolicitud": S.modal={texto:F.p9.confCancelarSolicitud,accion:"cancelarSolicitud"}; render(); return;

  case "quiz": {
    const o=C.quiz.opciones[Number(val)];
    S.quizEstado=o.ok?"ok":"mal";
    render(); return;
  }
  case "resumen": return alResumen();
  case "repetir": return iniciar(S.esc);
  case "otro":
    limpiarTimers();
    S={pant:"inicio",esc:null,campos:{},modal:null,toast:"",hist:[]};
    render(); return;
  }
});

function validarOTP(){
  const e=esc();
  if(v("codigo")===e.codigo){
    S.otpOk=true; S.otpErr="";
    render();
    tRevision=setTimeout(function(){ if(S.pant==="2"&&S.otpOk) go("3"); },1400);
    return;
  }
  S.otpIntentos++;
  if(S.otpIntentos>=3){ S.otpAgotado=true; S.otpErr=""; }
  else S.otpErr=F.p2.malo.replace("{i}",S.otpIntentos);
  set("codigo","");
  render();
}

app.addEventListener("input",function(ev){
  const k=ev.target.dataset?ev.target.dataset.k:null;
  if(!k) return;
  set(k,ev.target.value);
  if(k==="codigo"&&!S.otpAgotado&&!S.otpOk&&digitos(ev.target.value).length===4){ return validarOTP(); }
  if(k==="actividad"||k==="regimen"){ S.sugCampo=k; }
  if(k==="detalles"||k==="codigo"||k==="tel"||k==="ingreso"||k==="nombres"||k==="ap1"||k==="ap2"||k==="fd"||k==="fm"||k==="fa"){
    if(k!=="codigo") S.err="";
  }
  render();
});

app.addEventListener("change",function(ev){
  const el=ev.target;
  if(el.dataset&&el.dataset.act==="libre"){
    const val=el.value;
    if(!val) return;
    if(val==="zona"){ go("7"); S.zonaErr=true; render(); return; }
    if(val==="otpAgotado"){ S.otpAgotado=true; go("2"); return; }
    go(val); return;
  }
  if(el.dataset&&el.dataset.k){ set(el.dataset.k,el.value); S.err=""; render(); }
});

app.addEventListener("focusin",function(ev){
  const el=ev.target;
  const fk=el.dataset?el.dataset.k:null;
  if((fk==="actividad"||fk==="regimen")&&S.sugCampo!==fk){ S.sugCampo=fk; render(); }
});

app.addEventListener("keydown",function(ev){
  const el=ev.target;
  if(el.dataset&&(el.dataset.k==="actividad"||el.dataset.k==="regimen")&&ev.key==="Escape"&&S.sugCampo){ S.sugCampo=null; render(); return; }
  if(el.dataset&&el.dataset.k==="rfc"){
    const libres=["Tab","Shift","Control","Alt","Meta","Escape","Enter","ArrowLeft","ArrowRight","ArrowUp","ArrowDown","Home","End"];
    if(libres.indexOf(ev.key)>=0||ev.metaKey||ev.ctrlKey) return;
    ev.preventDefault();
    S.rfcManual++;
    toast(F.p4.rfcNoEditable);
  }
});
app.addEventListener("paste",function(ev){
  const el=ev.target;
  if(el.dataset&&el.dataset.k==="rfc"){
    ev.preventDefault(); S.rfcManual++; toast(F.p4.rfcNoEditable);
  }
});

render();


</script>
</body>
</html>
